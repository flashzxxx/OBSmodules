# ============================================================================
# fdl_experiments.ini - Load calibration and experiments A / B / R / hotspot
# ============================================================================
#
# Every config here inherits FDL-Scenario from fdl_params.ini, i.e. W=1,
# all-to-all randomised traffic (except FDL-Hotspot), 1 Gbps channels, ~4.3 kB
# bursts (T_burst = 34.4 us).
#
# ORDER OF WORK (2026-09-14 paper skeleton)
#   1. FDL-Calibrate  -> write k back into fdl_params.ini
#   2. Test-FDL-Basic/TooShort/Off  -> lock Scenario B + tau (M1)
#   3. FDL-Hotspot    -> confirm bottleneck rho >= 0.8 (week 8)
#   4. ExpA-TauSweep  -> 5.1; add VF iteration only after the NED param exists
#   5. ExpR-Retransmit -> 5.2; host module exists since week 9 (src/Retransmit/)
#   6. ExpB-Joint     -> 5.4; needs Task 1.3
#   7. FDL-RateCheck  -> 5.5 / D2
#
# Load points. 2026-09-18 recalibration (results/FDL-Calibrate-recal-2026-09-18/,
# after the edge-sender guardTime fix):
#   79.8 us -> rho ~ 0.20;  35.6 us -> rho ~ 0.40;
#   21.3 us -> rho ~ 0.59 (heaviest point). rho = 0.8 was NOT reached on
#   all-to-all traffic; do not label 21.3 us as rho = 0.8.
# Week-5 (guardTime=1ns, no warmup) had 80.5 / 35.9 / 21.3 us; the two lighter
# intervals moved by <1% in rho. Superseded values kept in the Week-5 report.
#
# Scheduler dimension: **.sat*.coreSwitch.enableVoidFilling = ${vf = false, true}.
# Implemented 2026-09-20 (week 9) and off by default; the ExpA grid itself is frozen in
# the week-10 pilot, which is where the dimension is switched on for the sweep, so that
# the week-8 ExpA-TauSweep batch below keeps its exact meaning.
# ============================================================================


# ----------------------------------------------------------------------------
# STEP 0 - Offered load calibration
#
# Sweeps the mean send interval with FDL off and records the resulting measured
# channel load. Offered load is proportional to 1/meanInterval below saturation,
# so a straight line through these points converts any target rho into the send
# interval that produces it.
#
# Read the result with:
#     python tools/calibrate_load.py results/FDL-Calibrate
#
# The script reports the measured maxChannelUtilization per run, fits the
# proportionality constant and prints the send intervals for rho = 0.2 ... 0.8,
# which are then pasted into fdl_params.ini and into the load list of
# Experiment B below.
#
# Short runs are sufficient: this only needs the mean carried load, not tail
# statistics.
#
# repeat = 2 is the Week-5 seed check: the same meanInterval must not produce
# bit-identical load when the RNG stream changes. 7 intervals x 2 seeds = 14
# runs. k is fitted over both seeds of every unsaturated point.
#
# RE-RUN HYGIENE: results/FDL-Calibrate/ holds the Week-5 originals and must not
# be overwritten. To recalibrate, run the sweep into a fresh dated directory by
# adding a one-line derived config, e.g.
#   [Config FDL-Calibrate-Recal-YYYYMMDD]
#   extends = FDL-Calibrate
#   result-dir = results/FDL-Calibrate-recal-YYYYMMDD
# then: python tools/calibrate_load.py results/FDL-Calibrate-recal-YYYYMMDD \
#                                 --targets 0.2 0.4 0.6 0.8
# (2026-09-18 recalibration lives in results/FDL-Calibrate-recal-2026-09-18/.)
# ----------------------------------------------------------------------------
[Config FDL-Calibrate]
extends = FDL-Scenario
description = "Offered load calibration sweep, FDL off"
**.sat*.coreSwitch.useFDL = false
**.sat*.host.udpApp[0].sendInterval = exponential(${meanInterval = 400us, 200us, 100us, 60us, 42.6us, 30us, 21.3us})
sim-time-limit = 2s
repeat = 2
seed-set = ${runnumber}
result-dir = results/FDL-Calibrate


# ----------------------------------------------------------------------------
# EXPERIMENT A - tau sweep (paper section 5.1)
#
# Research question: over what range of tau does a single FDL loopback help at
# W=1, and what fibre / delay-line budget does that correspond to?
#
# tau is swept in units of T_burst rather than absolute microseconds, because
# the useful range is set by the ratio, not by the absolute delay. T_burst is
# 34.4 us at the 1 Gbps simulation rate, so the ratios 0.25 / 0.5 / 1 / 2 / 4
# map to the tau values below. tools/fdl_design.py converts each ratio to the
# physical fibre length at the 10 Gbps design point:
#
#     ratio 0.25 -> 175 m      ratio 2 -> 1404 m
#     ratio 0.5  -> 351 m      ratio 4 -> 2807 m
#     ratio 1.0  -> 702 m
#
# Load dimension: currently the two measured all-to-all points (rho ~ 0.40 and
# ~ 0.59). A third point at rho >= 0.8 is added after FDL-Hotspot is measured
# in week 8; until then do not invent a 0.8 interval.
#
# Metrics: burstLossRate (primary), fdlUsageCount, fdlUtilization,
# maxChannelUtilization, end-to-end delay from the INET sinks.
#
# repeat = 5. Measured 2026-09-18 by ExpA-Pilot (n=10 per load): the seed-to-seed
# CV of burstLossRate is 0.3% at rho~0.40 and 0.2% at rho~0.59, i.e. the per-run
# estimate is already limited by the ~0.5-0.8M bursts received per run, not by
# the seed. Against a measured FDL-on vs FDL-off effect of 6.1-6.8 percentage
# points, repeat=5 gives a 95% CI half-width of ~0.02-0.03 pp -- a signal-to-noise
# ratio of ~200-340. The original worry (H5: seed noise comparable to the effect)
# does not materialise at this scale, so repeat=5 is kept.
# ----------------------------------------------------------------------------
[Config ExpA-TauSweep]
extends = FDL-Scenario
description = "Experiment A: tau sweep x measured load, FDL on"
**.sat*.coreSwitch.useFDL = true
**.sat*.coreSwitch.fdlDelayTime = ${tauSweep = 8.6us, 17.2us, 34.4us, 68.8us, 137.4us}
**.sat*.host.udpApp[0].sendInterval = exponential(${meanInterval = 35.6us, 21.3us})
# Void filling is NOT a dimension of this config, and that is a decision (D4, 2026-09-20), not
# an oversight: with one shared offset per scenario the arrival order equals the BCP order and
# void filling provably admits nothing the horizon rule refuses (measured voidFilledBursts = 0,
# scalar-identical runs). The main grid therefore keeps the horizon scheduler, so this config
# still means exactly what the week-8 batch meant. The scheduler question is answered by the
# asynchronous-offset arm below (ExpA-AsyncTauSweep / ExpA-AsyncNoFDL).
# **.sat*.coreSwitch.enableVoidFilling = ${vf = false, true}
repeat = 5
# seed-set = ${runnumber} so repeated runs are independent samples. Without it
# every repetition reuses the same RNG streams and repeat=N yields N identical
# runs, making confidence intervals meaningless (found 2026-09-18: only
# FDL-Calibrate and FDL-Hotspot had it).
seed-set = ${runnumber}
result-dir = results/ExpA-TauSweep

# No-FDL reference at the same loads. Experiment A is only interpretable
# against this line.
[Config ExpA-NoFDL]
extends = FDL-Scenario
description = "Experiment A reference: same loads, FDL off"
**.sat*.coreSwitch.useFDL = false
**.sat*.host.udpApp[0].sendInterval = exponential(${meanInterval = 35.6us, 21.3us})
repeat = 5
seed-set = ${runnumber}
result-dir = results/ExpA-NoFDL

# Single-tau repeat=10 pilot used to size ExpA-TauSweep's repeat.
# MEASURED 2026-09-18: seed CV 0.2-0.3% vs a 6-7 pp FDL effect -> repeat=5 is
# sufficient (see the note above [Config ExpA-TauSweep]). Keep this config as
# the regression check that the sweep can still resolve the effect.
# Needs seed-set = ${runnumber}: without it the 10 repeats were bit-identical.
[Config ExpA-Pilot]
extends = FDL-Scenario
description = "Experiment A pilot: one tau, two loads, repeat=10"
**.sat*.coreSwitch.useFDL = true
**.sat*.coreSwitch.fdlDelayTime = 34.4us
**.sat*.host.udpApp[0].sendInterval = exponential(${meanInterval = 35.6us, 21.3us})
repeat = 10
seed-set = ${runnumber}
result-dir = results/ExpA-Pilot

# Later sensitivity: guardTime = 1ns / 2us / 5us. Not an iteration of ExpA-TauSweep.
# [Config ExpA-GuardSweep]


# ----------------------------------------------------------------------------
# EXPERIMENT B - 2x2 edge x core (paper section 5.4)
#
# Research question: does edge scheduling move the loopback-vs-retransmit
# crossing, once the core has an FDL?
#
#     Baseline   edge=Static(3)   FDL off
#     EdgeOnly   edge=Dynamic(0)  FDL off
#     FDLOnly    edge=Static(3)   FDL on
#     Combined   edge=Dynamic(0)  FDL on
#
# FAIRNESS WARNING. The dispatch mode changes which packets are grouped into a
# burst, so the burst length distribution is not identical across the four
# arms, and burst length feeds directly into the FDL admission test through
# waitTime. The four arms are therefore NOT a clean single-variable comparison
# unless burst length is reported alongside the loss rate. carriedBytes[] and
# carriedBursts[] are recorded per port for exactly this purpose: their ratio
# is the mean burst size and must be compared across arms before any claim
# about "joint gain" is made.
#
# 2026-09-18 recalibration: 79.8us -> rho~0.20; 35.6us -> rho~0.40;
# 21.3us -> rho~0.59. rho=0.8 was not reached on all-to-all traffic.
# ----------------------------------------------------------------------------
[Config ExpB-Joint]
extends = FDL-Scenario
description = "Experiment B: 2x2 edge x core at measured loads"
**.sat*.edgeRouter.obs.assembler.dispatcher.dispatchMode = ${edgeMode = 3, 0}
**.sat*.coreSwitch.useFDL = ${fdl = false, true}
**.sat*.host.udpApp[0].sendInterval = exponential(${meanInterval = 79.8us, 35.6us, 21.3us})
repeat = 5
seed-set = ${runnumber}
result-dir = results/ExpB-Joint-release


# ----------------------------------------------------------------------------
# EXPERIMENT R - bufferless retransmission (paper section 5.2)
#
# The bufferless arm: the core still drops the burst on contention, and recovery happens
# in the time domain at the source instead of the optical domain at the switch. The app
# pair lives in src/Retransmit/ and is instantiated only by configs that ask for it, so the
# protected EdgeNode baseline is untouched.
#
# Read it against ExpA-NoFDL, which offers the same traffic and recovers nothing: the pair
# isolates what retransmission buys. What it costs is not hidden - every request carries a
# 64 B acknowledgement back through the same loaded constellation, so this arm's measured
# maxChannelUtilization is above its fresh offered load. Report both axes for this arm.
#
# retransmitTimeout = 60ms is above the worst-case round trip of the ring (5 ISL hops at
# 5ms each way, plus burst assembly); a shorter timeout would retransmit copies that are
# still in flight and would then be measuring the timeout, not the network.
#
# minSizeWithPadding IS OVERRIDDEN IN THIS CONFIG. The scenario default (500 B) exists for
# the data traffic, where bursts are ~4.3 kB and it never binds; on the acknowledgement path
# it is destructive. A 64 B acknowledgement plus IP/UDP and burst headers is ~101 B, and
# padding it to 500 B makes the switch hold it for 4 us instead of 0.8 us. Guard time
# dominates an OBS window, so that one line multiplies the cost of every acknowledgement by
# about 2.4x. MEASURED 2026-09-22 with the default padding: the arm does not merely lose more,
# it never comes back - live messages grew 47k -> 729k over 1.5 s of simulated time (the
# delay-line arms hold a steady 16-19k) until the 32-bit process died with an access
# violation at T=1.49 s. Pricing the control traffic at its real size is not a tuning trick,
# it is removing an artefact of the data-plane padding policy.
#
# LOAD POINTS ARE 79.8us AND 35.6us. At rho ~ 0.59 even a correctly priced acknowledgement
# plus the retransmissions that the loss itself provokes (about +30 percent of offered
# volume) push the bottleneck channel past capacity, and with no congestion control anywhere
# in the stack the backlog grows without bound. That is a property of open-loop
# retransmission rather than a tuning failure, and it is reported as a result: the bufferless
# arm's usable range is narrower than the loopback arm's. A windowed (rate-controlled)
# variant is the honest way to extend it and belongs to its own study, not to a fudge here.
# ----------------------------------------------------------------------------
[Config ExpR-Retransmit]
extends = FDL-Scenario
description = "Experiment R: bufferless core + host retransmission at the two stable loads"
**.sat*.coreSwitch.useFDL = false
**.sat*.host.udpApp[0].typename = "obsmodules.src.Retransmit.OBS_RetransmitSource"
**.sat*.host.udpApp[1].typename = "obsmodules.src.Retransmit.OBS_RetransmitSink"
**.sat*.host.udpApp[1].ackLength = 64B
# See the header: the 500 B scenario padding would hold each acknowledgement for 4 us
# instead of 0.8 us, and guard time dominates an OBS window, so that one line multiplies
# the cost of every acknowledgement by roughly 2.4x.
**.packetBurstifier[*].minSizeWithPadding = 64B
**.sat*.host.udpApp[0].retransmitTimeout = 60ms
**.sat*.host.udpApp[0].maxRetransmissions = 3
# 79.8us -> rho ~ 0.20 and 35.6us -> rho ~ 0.40. 21.3us (rho ~ 0.59) is deliberately
# absent: see the header, the arm runs away there.
**.sat*.host.udpApp[0].sendInterval = exponential(${meanInterval = 79.8us, 35.6us})
repeat = 5
seed-set = ${runnumber}
result-dir = results/ExpR-Retransmit-release

# ----------------------------------------------------------------------------
# EXPERIMENT R WITH A CORRECTLY SIZED TIMEOUT (measured 2026-09-22)
#
# The 60ms timeout above is marginally too short for this topology, and the measurement says
# so rather than the estimate: on the first two 79.8us runs the arm sent 266,536
# retransmissions against 244,659 fresh requests, i.e. more retransmissions than requests,
# with a mean completion delay of 69ms - above the timeout that provoked them. Those are
# mostly spurious: the copy was on its way, its acknowledgement simply had not come back
# within 60ms, because the ring's worst path is five ISL hops at 5ms each way and the queues
# add to that. A baseline that retransmits because it is impatient is not the alternative the
# paper is comparing against, so it would understate the bufferless route, not flatter it.
#
# 120ms clears the measured round trip with margin, so what remains is retransmission caused
# by actual loss. It also lowers the arm's self-generated load.
#
# CORRECTION (2026-09-22, week 14 research day B). An earlier version of this note claimed the
# 120ms timeout "makes the heavier 35.6us point operable at all". The measurement says
# otherwise: at 35.6us the arm grows without bound under BOTH timeouts (60ms and 120ms alike,
# live messages 188k-980k against a flat 31k at 79.8us - see walkthrough.md section 17). What
# 120ms buys is a cleaner arm at 79.8us; it does not extend the usable range to 35.6us. Report
# the two variants together - the timeout is part of the arm's definition, not a knob to tune
# until the answer looks right - and state which one each figure uses.
# ----------------------------------------------------------------------------
[Config ExpR-Retransmit-120ms]
extends = ExpR-Retransmit
description = "Experiment R with a timeout that clears the measured round trip"
**.sat*.host.udpApp[0].retransmitTimeout = 120ms
result-dir = results/ExpR-Retransmit-120ms-release


# ----------------------------------------------------------------------------
# EXPERIMENT R WITH A WINDOW ON THE OFFERED STREAM (2026-10-15).
#
# Why this exists: the open-loop arm above has no flow control at all, so the retransmissions
# that loss provokes add to the load that caused the loss, and at 35.6us its backlog grows
# without bound (week 14: live messages 188k-980k against a flat 31k at 79.8us). That is why
# section 5.2 rests on a single comparable load point. The window (windowSize, NED default
# 0 = unlimited) bounds the unacknowledged requests in flight, retransmissions included, and
# defers rather than drops what would exceed it, so the same route can be measured at loads
# where the open-loop variant diverges. Design, alternatives and acceptance gates:
# ../OBSmodules-docs/research_reports/2026-10-15-retransmit-window/方案.md
#
# STANDALONE, NOT DERIVED - and that is load-bearing. FDL-Scenario declares sendInterval as an
# iteration variable (exponential(${meanInterval = ...})), and OMNeT++ rejects redefining an
# inherited iteration variable, so a child of ExpR-Retransmit could not select the loads. The
# same trap is already recorded for ExpR-EdgePair and ExpA-NoFDL-Light. Everything else is
# copied from ExpR-Retransmit on purpose: same app pair, same 64 B acknowledgement with the
# minSizeWithPadding override, same useFDL = false, same repeat and seed-set. A retransmission
# arm with a window is only comparable to the open-loop one if nothing else moved with it.
#
# TIMEOUT 60ms, NOT 120ms. 60ms is this arm's original definition (ExpR-Retransmit), so the
# windowed variant is the same arm plus one parameter. The 120ms variant stays as the separate
# clean-timeout arm it always was; the timed-out-vs-windowed pair is a later question.
#
# THE OFFERED STREAM IS STRICTLY PERIODIC. par("sendInterval") is evaluated once at
# initialization, so "exponential(...)" here is one fixed draw per source, not a Poisson
# process. The window therefore changes only how much of a known offered rate is deferred; it
# does not change the offered rate itself.
#
# LOADS: 79.8us and 35.6us are carried so the windowed arm can be read against the open-loop
# one point by point; 21.3us is carried because it is the load where the open-loop arm was
# unusable, which is the whole reason for the window. Whether 21.3us is stable under the window
# is an open question this batch answers - do not assume it from the parameter alone.
#
# WINDOW 4/8/16. W is a free parameter and the result depends on it, so it is an axis and not a
# choice: too small starves the link, too large reintroduces the runaway. Every W is reported;
# the sweep is the honest form of the claim, not a knob to be tuned until the answer looks right.
#
# The two zero-window points are the open-loop control. Together with ExpR-RetransmitWin-Gate
# they are what the G1 gate compares against the pre-window output, as the evidence that adding
# the window changed only the deferral behaviour and nothing else.
#
# Cost: 3 loads x 4 windows x repeat 5 = 60 run at 2s. This is the largest batch this arm has
# been given; run Test-Smoke-RetxWindow (0.2s) first.
# ----------------------------------------------------------------------------
[Config ExpR-RetransmitWin]
extends = FDL-Scenario
description = "Experiment R with a window on the in-flight requests (60ms timeout)"
**.sat*.coreSwitch.useFDL = false
**.sat*.host.udpApp[0].typename = "obsmodules.src.Retransmit.OBS_RetransmitSource"
**.sat*.host.udpApp[1].typename = "obsmodules.src.Retransmit.OBS_RetransmitSink"
**.sat*.host.udpApp[1].ackLength = 64B
**.packetBurstifier[*].minSizeWithPadding = 64B
**.sat*.host.udpApp[0].retransmitTimeout = 60ms
**.sat*.host.udpApp[0].maxRetransmissions = 3
**.sat*.host.udpApp[0].windowSize = ${windowSize = 0, 4, 8, 16}
**.sat*.host.udpApp[0].sendInterval = exponential(${meanInterval = 79.8us, 35.6us, 21.3us})
repeat = 5
seed-set = ${runnumber}
result-dir = results/ExpR-RetransmitWin-release

# ----------------------------------------------------------------------------
# THE SAME ARM, ONE WINDOW PER CONFIG (2026-10-15, third attempt - see the note).
#
# ExpR-RetransmitWin above iterates over windowSize, and that turned out to be a trap three
# times over. All three were measured, not guessed:
#
#  1. OMNeT++ runs the cells in iteration order and windowSize = 0 comes first, so the batch died
#     on cell 5 (35.6us/rep0) - W = 0 at 35.6us IS the open-loop arm that runs away. 54 of 60
#     runs were lost that way, and the six files written are all W = 0.
#
#  2. A child config cannot narrow the window by assigning it. With
#     "**.sat.host.udpApp[0].windowSize = 4" in the child and no extra variable, all 60 cells ran
#     at W = 4 while their iterationvars still claimed windowSize 0/4/8/16 - the file whose attr
#     says "windowSize 0" had requestsOutstandingMax 4 and windowDefers 151. Invalid, discarded.
#
#  3. Nor can it be narrowed by adding a second variable: "windowSize = ${w4 = 4}" does not
#     remove the parent's inherited iteration variable, it nests inside it, so the cell count
#     comes back as 5 loads x 4 parent values x 1 child value x 5 reps = 100 (60 files written
#     before the W = 0 cells at 35.6us killed it again). Invalid, discarded.
#
# An iteration variable defined in a parent cannot be removed down the chain, so the only clean
# construction is a SEPARATE BASE that does not declare one. ExpR-RetransmitWinBase below is that
# base: identical to ExpR-RetransmitWin except that windowSize is a plain NED parameter with its
# default, not an iteration axis. Each window config then sets it once and iterates only over the
# load and the repetition, which gives the intended 3 x 5 = 15 cells per window.
#
# There is deliberately no W = 0 config here: with the window it would be unbounded, which is the
# arm that cannot be run at these loads. The W = 0 cells that matter already exist -
# ExpR-RetransmitWin-release (79.8us, 5 seeds, completed) and the pre-window directories.
# ----------------------------------------------------------------------------
[Config ExpR-RetransmitWinBase]
extends = FDL-Scenario
description = "Experiment R, window as a plain parameter - the base for the per-window arms"
**.sat*.coreSwitch.useFDL = false
**.sat*.host.udpApp[0].typename = "obsmodules.src.Retransmit.OBS_RetransmitSource"
**.sat*.host.udpApp[1].typename = "obsmodules.src.Retransmit.OBS_RetransmitSink"
**.sat*.host.udpApp[1].ackLength = 64B
**.packetBurstifier[*].minSizeWithPadding = 64B
**.sat*.host.udpApp[0].retransmitTimeout = 60ms
**.sat*.host.udpApp[0].maxRetransmissions = 3
**.sat*.host.udpApp[0].sendInterval = exponential(${meanInterval = 79.8us, 35.6us, 21.3us})
repeat = 5
seed-set = ${runnumber}

# ----------------------------------------------------------------------------
# LOOPBACK AT THE THIRD LOAD (2026-10-15).
#
# Why this exists: the loopback arm was measured at 35.6us and 21.3us (ExpA-TauSweep, and the
# no-FDL reference in ExpA-NoFDL), but never at 79.8us. The retransmission arm has its only
# complete open-loop cell at 79.8us. So the two arms did not share a single load, and the
# side-by-side figure could not be drawn on a common axis - each curve was alone at its own
# utilisation. This config supplies the missing loopback point at the same 79.8us offer.
#
# STANDALONE, NOT DERIVED, for the reason recorded above the window arms: FDL-Scenario declares
# sendInterval as an iteration variable over (35.6us, 21.3us), and an iteration variable defined
# in an ancestor cannot be removed down the chain. A child assigning 79.8us would either keep
# iterating the parent's values or nest into them. Writing the interval as a literal here, in a
# config that does not inherit that iteration variable, is the only clean construction.
#
# Everything else is the FDL scenario default on purpose, so this is the same arm the tau sweep
# measured: useFDL = true, tau = 34.4us = T_burst (the tau/T = 1 point the sweep found optimal),
# single loopback (maxFdlLoopsPerBurst = 1), Horizon scheduler, Dynamic edge, all-to-all traffic.
#
# repeat 5, seed-set = ${runnumber}: same convention as every other arm, so the five runs are
# independent samples and the point is comparable with the retransmission arm's five.
# ----------------------------------------------------------------------------
[Config ExpA-Loopback-798]
extends = FDL-Scenario
description = "Experiment A reference: loopback FDL at tau/T=1 on the 79.8us offer"
**.sat*.coreSwitch.useFDL = true
**.sat*.coreSwitch.fdlDelayTime = 34.4us
**.sat*.host.udpApp[0].sendInterval = exponential(79.8us)
repeat = 5
seed-set = ${runnumber}
result-dir = results/ExpA-Loopback-798-release

[Config ExpR-RetransmitWin-W4]
extends = ExpR-RetransmitWinBase
description = "Experiment R, window 4, loads x repeat 5"
**.sat*.host.udpApp[0].windowSize = 4
result-dir = results/ExpR-RetransmitWin-W4-release

[Config ExpR-RetransmitWin-W8]
extends = ExpR-RetransmitWinBase
description = "Experiment R, window 8, loads x repeat 5"
**.sat*.host.udpApp[0].windowSize = 8
result-dir = results/ExpR-RetransmitWin-W8-release

[Config ExpR-RetransmitWin-W16]
extends = ExpR-RetransmitWinBase
description = "Experiment R, window 16, loads x repeat 5"
**.sat*.host.udpApp[0].windowSize = 16
result-dir = results/ExpR-RetransmitWin-W16-release

# ----------------------------------------------------------------------------
# THE UPPER HALF OF THE WINDOW AXIS (2026-10-15, added after reading the first three).
#
# W = 4/8/16 delivered only 7.9 / 13.9 / 23.3 Mbit/s at 79.8us, against 1125.7 for the open-loop
# arm at the same cell. That is not a defect in the window: the arm is bandwidth-delay-product
# limited. Measured completion delay is ~51 ms and the in-flight bound is W, so a source can only
# carry W/0.051 requests per second, and the three windows land exactly where that predicts
# (0.86 / 1.77 / 3.50 Mbit/s per source). The window IS working - it just cannot express a
# throughput the RTT does not allow.
#
# So the low windows cannot answer the question section 5.2 asks. The useful upper end is set by
# the open-loop cell itself: at 79.8us it carries 1471 requests in flight and is still alive
# (it crashes only at 35.6us). A window below that is guaranteed to deliver less, so the sweep is
# extended to bracket it. These four values span 64x and reach just past the open-loop mark.
#
# What each outcome would mean:
#   * goodput rises to the open-loop level with the window still binding  -> the arm can be
#     rescued at 79.8us, and the interesting question becomes what it does at 35.6/21.3us;
#   * goodput plateaus below it, or the upper windows stop binding (in-flight high-water mark
#     below W) -> the arm is recovery-latency-limited and no window fixes it, which is a result
#     about the mechanism rather than about the parameter.
# ----------------------------------------------------------------------------
[Config ExpR-RetransmitWin-W64]
extends = ExpR-RetransmitWinBase
description = "Experiment R, window 64, loads x repeat 5"
**.sat*.host.udpApp[0].windowSize = 64
result-dir = results/ExpR-RetransmitWin-W64-release

[Config ExpR-RetransmitWin-W256]
extends = ExpR-RetransmitWinBase
description = "Experiment R, window 256, loads x repeat 5"
**.sat*.host.udpApp[0].windowSize = 256
