# ----------------------------------------------------------------------------
# HOTSPOT TRAFFIC - raise bottleneck rho above the all-to-all ceiling (~0.59)
#
# Nine sources send only to sat2; sat2 replies to sat1. MEASURED 2026-09-18
# (coarse sweep results/FDL-Hotspot-calib-2026-09-18/, 40 runs; fine sweep
# results/FDL-Hotspot-fine-2026-09-18/). The bottleneck is sat3 port1, i.e. the
# sat3 -> sat2 ISL, which carries the five right-hand sources (sat3, sat6, sat7,
# sat9, sat10 -- the only ones whose shortest path to sat2 uses that link).
# Measured rho on that link, 4 seeds per point:
#   25us -> 0.7253   21.3us -> 0.7765   20.5us -> 0.7888   20us -> 0.7967
#   19.5us -> 0.8061 19us -> 0.8146     18us -> 0.8327     15us -> 0.8936
#   12us -> 0.9455   (there the seeds are identical: the link is fully
#                     saturated, so rho pins to the ceiling regardless of seed)
# Third Experiment-A load point = 19.5us -> rho ~= 0.806. Seeds differ at every
# interval except the fully saturated 12us.
#
# FDL remains off so this can also serve as a recalibration of the hotspot matrix.
# ----------------------------------------------------------------------------
[Config FDL-Hotspot]
extends = FDL-Scenario
description = "Hotspot: nine sources to sat2, FDL off, load sweep"
**.sat*.coreSwitch.useFDL = false
**.sat1.host.udpApp[0].destAddresses  = "sat2.host"
**.sat2.host.udpApp[0].destAddresses  = "sat1.host"
**.sat3.host.udpApp[0].destAddresses  = "sat2.host"
**.sat4.host.udpApp[0].destAddresses  = "sat2.host"
**.sat5.host.udpApp[0].destAddresses  = "sat2.host"
**.sat6.host.udpApp[0].destAddresses  = "sat2.host"
**.sat7.host.udpApp[0].destAddresses  = "sat2.host"
**.sat8.host.udpApp[0].destAddresses  = "sat2.host"
**.sat9.host.udpApp[0].destAddresses  = "sat2.host"
**.sat10.host.udpApp[0].destAddresses = "sat2.host"
**.sat*.host.udpApp[0].sendInterval = exponential(${meanInterval = 35.6us, 21.3us, 19.5us})
sim-time-limit = 2s
repeat = 2
seed-set = ${runnumber}
result-dir = results/FDL-Hotspot


# ----------------------------------------------------------------------------
# RATE CHECK - validity of the 1 Gbps normalisation
#
# Re-runs a single operating point at the 10 Gbps physical design rate with
# every dimensionless ratio held constant. Scaled (all /10 vs FDL-Scenario):
#   rho, tau/T_burst, offset/T_burst, guard/T_burst, T_proc/T_burst
# sim-time-limit stays 0.2s; rho is not comparable to 2s configs.
#
# PASS CRITERION: burstLossRate and fdlUsageCount agree with the corresponding
# 1 Gbps point within the seed-to-seed spread. If they do not, the normalisation
# is invalid and Experiment A must be re-run at the physical rate.
#
# This is expensive (about ten times the events of a normal point), which is
# why it is one point and not a sweep.
# ----------------------------------------------------------------------------
[Config FDL-RateCheck]
extends = FDL-Scenario
description = "Normalisation check: same dimensionless operating point at 10 Gbps"
**.sat*.coreSwitch.**.dataRate = 10Gbps
**.sender.dataRate = 10Gbps
**.sat*.coreSwitch.useFDL = true
**.sat*.coreSwitch.fdlDelayTime = 3.44us
**.sat*.coreSwitch.**.BCPProcessingDelay = 0.1us
**.sat*.coreSwitch.**.guardTime = 0.2us
**.sat*.**.sender.guardTime = 0.2us
**.sat*.coreSwitch.switchReconfigTime = 0.2us
# Scaled 500us/1ms from FDL-Scenario; maxOffset must stay strictly larger than minOffset.
**.packetBurstifier[*].minOffset = 50us
**.packetBurstifier[*].maxOffset = 100us
**.sat*.host.udpApp[0].sendInterval = exponential(4.26us)
sim-time-limit = 0.2s
repeat = 3
seed-set = ${runnumber}
result-dir = results/FDL-RateCheck

# ----------------------------------------------------------------------------
# RATE CHECK REFERENCE - the same dimensionless operating point at 1 Gbps (week 12)
#
# FDL-RateCheck above runs the point at the 10 Gbps physical design rate. Deciding D2 means
# comparing it against the SAME point at the 1 Gbps rate the sweeps use, or the go/no-go
# criteria have nothing to compare against. Every dimensionless ratio is held constant:
#
#                      10 Gbps (RateCheck)   1 Gbps (this config)   ratio
#   T_burst            3.436 us              34.36 us               10
#   tau/T_burst        3.44 / 3.436 = 1.00   34.4 / 34.36 = 1.00    1
#   sendInterval/      4.26 / 3.436 = 1.24   42.6 / 34.36 = 1.24    1
#   guard/T_burst      0.2 / 3.436 = 0.058   2 / 34.36 = 0.058      1
#   BCP process/T      0.1 / 3.436 = 0.029   1 / 34.36 = 0.029      1
#   offset/T_burst     50-100 us / 3.436     500-1000 us / 34.36    1
#
# LENGTHS DIFFER ON PURPOSE: this reference keeps FDL-Scenario's 2 s while FDL-RateCheck
# runs 0.2 s, because the two rates see the same dimensionless point only if the simulated
# duration scales with the rate (2 s at 1 Gbps = 0.2 s at 10 Gbps in T_burst units). The
# warmup cannot scale with it: it excludes a path-fill transient that is 5 ms per hop in
# REAL seconds whatever the bit rate, so the 10 Gbps run spends 25 percent of its length in
# warmup against 2.5 percent here. Consequence, measured 2026-09-22: the measurement
# windows are 43,655 vs 56,752 T_burst, so the raw event counts (fdlUsageCount,
# carriedBursts) differ by exactly that ratio - 23 percent - while per T_burst they agree
# to 0.06 percent. tools/compare_ratecheck.py reports both and compares the counts per
# T_burst; rho is NOT comparable to the 2 s configs and is not used here.
# ----------------------------------------------------------------------------
[Config FDL-RateCheckRef]
extends = FDL-Scenario
description = "Normalisation reference: the RateCheck point at the 1 Gbps sweep rate"
**.sat*.coreSwitch.useFDL = true
**.sat*.coreSwitch.fdlDelayTime = 34.4us
**.sat*.host.udpApp[0].sendInterval = exponential(42.6us)
repeat = 3
seed-set = ${runnumber}
result-dir = results/FDL-RateCheckRef-release

# ----------------------------------------------------------------------------
# ASYNCHRONOUS-OFFSET ARM (decision D4 option A, 2026-09-20)
#
# Why this exists: in the standard scenario every source shares one offset, arrival order
# equals BCP order, and void filling provably cannot admit anything the horizon rule
# refuses - measured voidFilledBursts = 0 and a scalar-identical run. So the scheduler
# dimension is only meaningful once offsets differ between sources, which is also the more
# realistic assumption: each terminal assembles bursts on its own timer.
#
# Decision D4 (user, 2026-09-20) keeps the MAIN grid on Horizon (ExpA-TauSweep /
# ExpA-NoFDL above keep their exact week-8 meaning) and treats the standard-scenario
# horizon/VF equivalence as a structural result, while this arm answers the separate
# question of when void filling is worth having.
#
# GRID SHAPE FROZEN 2026-09-20 (week 10, see ../OBSmodules-docs/research_reports/2026-09-week10/网格冻结.md):
# tau in units of T_burst = 0.25 / 0.5 / 1 / 2 / 4 (the full sweep, because the pilot showed
# the asynchronous optimum lies beyond 2 - the turning point has to be inside the grid),
# the two measured all-to-all loads, and both schedulers. repeat = 2 for the week-10 pilot
# and 5 for the week-11 batch (seed spread measured at <= 0.06 pp, so 5 is generous).
#
# The rho ~ 0.81 hotspot is NOT part of this arm: it is a different traffic matrix, and
# putting it on the same tau curve would confound the tau optimum with the traffic shape.
# It is a separate sensitivity scenario (ExpA-HotspotPoint below, paper section 5.5).
#
# RESULT DIRS CARRY THE BUILD MODE. .sca files are not comparable across debug/release
# (measured 2026-09-20: 79-84 last-digit differences plus a 3 ps end-of-simulation shift),
# and the week-8 batch did not record its mode. Run these configs in release only; the
# directory name says so, so a future mixed-mode figure is impossible by construction.
# ----------------------------------------------------------------------------
[Config ExpA-AsyncTauSweep]
extends = FDL-Scenario-Async
description = "Experiment A under asynchronous offsets: tau x load x scheduler, FDL on"
**.sat*.coreSwitch.useFDL = true
**.sat*.coreSwitch.fdlDelayTime = ${tauSweep = 8.6us, 17.2us, 34.4us, 68.8us, 137.4us}
**.sat*.coreSwitch.enableVoidFilling = ${vf = false, true}
**.sat*.host.udpApp[0].sendInterval = exponential(${meanInterval = 35.6us, 21.3us})
# Frozen at 5 for the week-11 batch (week-10 pilot was 2; seed spread measured <= 0.06 pp).
repeat = 5
seed-set = ${runnumber}
result-dir = results/ExpA-AsyncTauSweep-release

# Reference line of the asynchronous arm. It must be its own config: the offset profile
# changes which bursts contend, so ExpA-NoFDL (synchronous) is not a valid contrast here.
[Config ExpA-AsyncNoFDL]
extends = FDL-Scenario-Async
description = "Asynchronous-offset reference: same loads, FDL off, scheduler pair"
**.sat*.coreSwitch.useFDL = false
**.sat*.coreSwitch.enableVoidFilling = ${vf = false, true}
**.sat*.host.udpApp[0].sendInterval = exponential(${meanInterval = 35.6us, 21.3us})
repeat = 5
seed-set = ${runnumber}
result-dir = results/ExpA-AsyncNoFDL-release

# ----------------------------------------------------------------------------
# SCENARIO B - the high-load sensitivity point (paper 5.5), frozen 2026-09-20.
#
# Week 8 measured the hotspot bottleneck at 19.5us -> rho = 0.8074 on the sat3 -> sat2 ISL,
# seeds distinct (results/FDL-Hotspot-fine-2026-09-18/). All-to-all traffic cannot reach
# rho = 0.8 in this topology (it saturates near 0.59), so this is the only way to test
# whether the tau conclusions survive a genuinely loaded bottleneck.
#
# It is a separate scenario rather than a third load point of the tau sweep: the traffic
# matrix differs, so putting it on the same tau curve would confound the tau optimum with
# the traffic shape. Synchronous offsets and the horizon scheduler, i.e. the same core
# configuration as the main grid, so the only thing that changes against ExpA-TauSweep is
# the traffic matrix. Void filling is therefore absent here by construction - it is provably
# identical to Horizon in the synchronous case, which is the week-9 structural result.
# ----------------------------------------------------------------------------
[Config ExpA-HotspotPoint]
extends = FDL-Scenario
description = "Scenario B (5.5): hotspot at rho~0.8074, FDL on/off x tau/T 0.5/1/2"
**.sat1.host.udpApp[0].destAddresses  = "sat2.host"
**.sat2.host.udpApp[0].destAddresses  = "sat1.host"
**.sat3.host.udpApp[0].destAddresses  = "sat2.host"
**.sat4.host.udpApp[0].destAddresses  = "sat2.host"
**.sat5.host.udpApp[0].destAddresses  = "sat2.host"
**.sat6.host.udpApp[0].destAddresses  = "sat2.host"
**.sat7.host.udpApp[0].destAddresses  = "sat2.host"
**.sat8.host.udpApp[0].destAddresses  = "sat2.host"
**.sat9.host.udpApp[0].destAddresses  = "sat2.host"
**.sat10.host.udpApp[0].destAddresses = "sat2.host"
**.sat*.host.udpApp[0].sendInterval = exponential(19.5us)
**.sat*.coreSwitch.useFDL = ${fdl = false, true}
# tau is inert while fdl = false; the three values only matter for the FDL arms, so the
# off case repeats three times. Kept explicit instead of splitting the config because a
# split would hide that the reference line is the same run.
**.sat*.coreSwitch.fdlDelayTime = ${tauSweep = 17.2us, 34.4us, 68.8us}
# Frozen at 5 for the week-11 batch (week-10 pilot was 1).
repeat = 5
seed-set = ${runnumber}
result-dir = results/ExpA-HotspotPoint-release

# ----------------------------------------------------------------------------
# SYNCHRONOUS ARM, RE-RUN IN A RECORDED BUILD MODE (week 11)
#
# The week-8 batch produced results/ExpA-TauSweep and results/ExpA-NoFDL without recording
# whether it was a debug or a release build, and .sca files are not comparable across the
# two (measured 2026-09-20: 79-84 last-digit differences plus a 3 ps end-of-simulation
# shift). These derived configs re-run the SAME grid with the SAME seeds into directories
# whose names carry the mode, so the week-8 files stay untouched as the historical record
# and every figure drawn from now on comes from one mode.
#
# Because seed-set = ${runnumber} and the iteration variables are unchanged, the re-run is
# also the check on which mode week 8 used: same seeds means the same RNG streams, so a
# matching aggregate says week 8 was release, and a systematic last-digit difference says
# it was debug (its magnitude is far below any loss-rate effect either way).
# ----------------------------------------------------------------------------
[Config ExpA-TauSweep-release]
extends = ExpA-TauSweep
description = "Week-8 tau sweep re-run in release, new result dir"
result-dir = results/ExpA-TauSweep-release

# ----------------------------------------------------------------------------
# NO-RECOVERY REFERENCE AT THE LIGHTEST LOAD (week 11)
#
# Experiment R can only operate at 79.8us (rho ~ 0.20 fresh): at 35.6us its own
# retransmissions and acknowledgements push the network past capacity and the backlog grows
# without bound. But the plain ExpA-NoFDL config only covers 35.6us and 21.3us, so without
# this config the retransmission arm has no same-load reference and its delivery could be
# compared only against the FDL arm offered twice as much traffic - which is exactly the
# confound the measured-load axis is supposed to remove.
#
# It is a separate config rather than another value of ExpA-NoFDL's iteration variable
# because OMNeT++ rejects redefining an inherited iteration variable in a derived config.
# ----------------------------------------------------------------------------
[Config ExpA-NoFDL-Light]
extends = FDL-Scenario
description = "No-recovery reference at the retransmission arm's fresh load (rho ~ 0.20)"
**.sat*.coreSwitch.useFDL = false
