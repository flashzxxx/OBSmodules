repeat = 5
seed-set = ${runnumber}
result-dir = results/ExpA-NoFDL-Light-release

[Config ExpA-NoFDL-release]
extends = ExpA-NoFDL
description = "Week-8 No-FDL reference re-run in release, new result dir"
result-dir = results/ExpA-NoFDL-release

# ----------------------------------------------------------------------------
# EXPERIMENT R UNDER BOTH EDGE MODES - what section 5.4 actually needs (week 13)
#
# Experiment B above varies (edge mode, FDL on/off), so on its own it answers whether the
# edge changes what the delay line buys. The 5.4 question is narrower and different: does the
# edge move the crossing between loopback and retransmission? Answering that needs the
# retransmission arm at the same edge modes, and every earlier ExpR point was measured under
# FDL-Scenario's default Dynamic dispatcher, so there is currently nothing to compare against.
#
# It is a standalone config rather than a derived one because ExpR-Retransmit declares its
# load as an iteration variable and OMNeT++ rejects redefining an inherited iteration
# variable with a literal. The load stays at 79.8us, the only point where open-loop
# retransmission is stable (35.6us runs away - see the ExpR header).
# ----------------------------------------------------------------------------
[Config ExpR-EdgePair]
extends = FDL-Scenario
description = "Retransmission arm at both edge modes, at the only stable load"
**.sat*.coreSwitch.useFDL = false
**.sat*.host.udpApp[0].typename = "obsmodules.src.Retransmit.OBS_RetransmitSource"
**.sat*.host.udpApp[1].typename = "obsmodules.src.Retransmit.OBS_RetransmitSink"
**.sat*.host.udpApp[1].ackLength = 64B
**.packetBurstifier[*].minSizeWithPadding = 64B
**.sat*.host.udpApp[0].retransmitTimeout = 120ms
**.sat*.host.udpApp[0].maxRetransmissions = 3
**.sat*.edgeRouter.obs.assembler.dispatcher.dispatchMode = ${edgeMode = 0, 3}
**.sat*.host.udpApp[0].sendInterval = exponential(79.8us)
repeat = 5
seed-set = ${runnumber}
result-dir = results/ExpR-EdgePair-release


# ----------------------------------------------------------------------------
# BATCH 1 (week 14, research day B) - STATIC ARMS AT 10 QUEUES, A COUNTERFACTUAL ONLY
#
# THE EDGE NODE IS DESIGNED WITH 8 PHYSICAL QUEUES FOR 10 DESTINATIONS (params.ini). Fewer
# queues than destinations is a design premise, not a tunable, so these 10-queue arms are OFF
# THE DESIGN and must not supply the paper's numbers. Section 5.4 quotes the week-13 8-queue
# arms (ExpB-Joint, ExpR-EdgePair). What these arms are for: under the design, mode 3 maps
# (targetLabel - 1) % numQueues, so destinations 1/9 and 2/10 share a queue and Static drops
# 14.21-14.27% of packets before assembly. Removing the queue shortage makes that drop 0.000%
# and puts Static on Dynamic, which isolates the mechanism: Dynamic's end-to-end advantage
# exists exactly in the queue-scarce regime the design targets.
#
# NEW RESULT DIRS, NOT THE WEEK-13 ONES. The week-13 directories stay untouched: they are
# the design-premise data the paper uses, and they are also the old-binary half of the
# regression. Overwriting them would destroy both roles.
#
# INI ONLY - runs on the CURRENT release executable, no rebuild needed. The 10-queue grid is a
# DIFFERENT experiment from the 8-queue one, not a per-cell re-run of it: the grid, the run
# numbering and therefore the seed-to-cell assignment all change, so week 13 and this batch are
# compared as 5-repeat distribution means, NOT cell by cell. (The earlier note claiming "same
# binary, same seeds, so the files pair up cell for cell" was wrong.)
#
# numPacketBurstifiers belongs to OBS_BurstAssembler, and its NED sizes the dispatcher gates,
# the burstifier array and the sender's input array from it, so this is a configuration change
# and src/EdgeNode/ is untouched. params.ini keeps its 8-queue default: that stays the
# baseline, only these two arms ask for 10.
#
# Dynamic is NOT re-run: ExpS-EdgeQueues already measured it at both queue counts and it is
# 0.000% either way, so the Dynamic arm of the 2x2 is unaffected by the provisioning.
#
# STANDALONE, NOT DERIVED - and that is load-bearing. ExpB-Joint declares dispatchMode,
# sendInterval and useFDL AS ITERATION VARIABLES (${edgeMode}, ${meanInterval}, ${fdl}), and it
# is the inherited-iteration-variable conflict that this config exists to avoid: the same trap is
# already recorded for ExpA-NoFDL-Light and ExpR-EdgePair.
#
# dispatchMode is written as a SINGLE-VALUED iteration variable, not a literal. It costs no extra
# run (one value is one cell) and it keeps `edgeMode` in the .sca iterationvars - which is the
# axis the analysis scripts group by (tools/plot_fig7_expB.py, tools/analyze_w14_sensitivity.py).
# A literal here would drop the axis and the Static arm would be filed under nothing.
#
# Cost: 2 fdl x 3 loads x repeat 5 = 30 run, plus 1 x 5 = 5 for the retransmission pair = 35.
# ----------------------------------------------------------------------------
[Config ExpB-Joint-10Q]
extends = FDL-Scenario
description = "Batch 1: Static arm of the 2x2 re-run at 10 edge queues (no aliasing)"
**.sat*.edgeRouter.**.numPacketBurstifiers = 10
**.sat*.edgeRouter.obs.assembler.dispatcher.dispatchMode = ${edgeMode = 3}
**.sat*.coreSwitch.useFDL = ${fdl = false, true}
**.sat*.host.udpApp[0].sendInterval = exponential(${meanInterval = 79.8us, 35.6us, 21.3us})
repeat = 5
seed-set = ${runnumber}
result-dir = results/ExpB-Joint-10Q-release

[Config ExpR-EdgePair-10Q]
extends = FDL-Scenario
description = "Batch 1: retransmission arm, Static edge, 10 queues (pairs with ExpB-Joint-10Q)"
**.sat*.coreSwitch.useFDL = false
**.sat*.host.udpApp[0].typename = "obsmodules.src.Retransmit.OBS_RetransmitSource"
**.sat*.host.udpApp[1].typename = "obsmodules.src.Retransmit.OBS_RetransmitSink"
**.sat*.host.udpApp[1].ackLength = 64B
**.packetBurstifier[*].minSizeWithPadding = 64B
**.sat*.host.udpApp[0].retransmitTimeout = 120ms
**.sat*.host.udpApp[0].maxRetransmissions = 3
**.sat*.edgeRouter.**.numPacketBurstifiers = 10
**.sat*.edgeRouter.obs.assembler.dispatcher.dispatchMode = ${edgeMode = 3}
**.sat*.host.udpApp[0].sendInterval = exponential(79.8us)
repeat = 5
seed-set = ${runnumber}
result-dir = results/ExpR-EdgePair-10Q-release


# ----------------------------------------------------------------------------
# BATCH 2 (week 14, research day B) - IS THE LONG-BURST SHORTFALL REAL?
#
# Week 14 found numPackets = 6 carrying only 5.12-5.15 packets (7322-7361 B) against a nominal
# 8582 B, with dispatchMode = 1 (NoPreemption) reaching exactly 6.00 packets. That evidence is
# a 0.2s / repeat 1 / single seed probe (Test-Smoke-BurstLenNoPreempt), so it cannot go into
# 5.5 as a result. This arm re-measures it at the main grid's duration and repetition.
#
# ONE LOAD (35.6us), useFDL = FALSE. The useFDL line is what keeps the arm about the EDGE: with
# the delay line off there is no loopback to rescue a truncated burst, so carriedBytes /
# carriedBursts reads the assembled length directly and nothing the core does can move it.
#   * One load only, and the lower one, so the result reflects edge assembly and not the
#     delay line. As a cross-check, both modes must land on the same core loss as the
#     ExpS-BurstLen-NoFDL reference at this load (n=3 ~12.93%, n=6 ~12.84%): if they drift,
#     something other than the dispatcher is moving and the arm has to be re-read.
#
# STANDALONE, NOT DERIVED. ExpS-BurstLen declares numPackets and ratio as ITERATION VARIABLES and
# its fdlDelayTime expression (${ratio = ...} * (1429 * ${numPackets} + 8) * 0.008us) references
# them, so a child config cannot re-declare either; this one therefore re-declares every axis it
# needs itself, including the granularity axis.
#
# THE AXIS NAME IS numPackets ON PURPOSE, the same name week 14 used. The iteration variables are
# what the analysis scripts key on (tools/analyze_w14_sensitivity.py groups by numPackets), so
# renaming the axis to avoid a collision that no longer exists would silently cost the scripts
# this batch. A standalone config has nothing to collide with.
#
# `ratio` is NOT declared here, so it will read as "-" in this batch's .sca keys. That is
# deliberate and harmless: tau is inert while useFDL = false, and tools/analyze_async_vf.py
# already defaults a missing key to "-". Anything written for this batch must key on
# numPackets / edgeMode / meanInterval only.
#
# TAU IS INERT HERE because useFDL = false: it is left at the main grid's optimum and carries no
# meaning in this arm. The point of the arm is the assembled burst LENGTH, not the delay.
#
# Both modes are carried so the outcome is a dose-response, not a single contrast:
#   mode 0 (Dynamic)      truncates via forceFlush when it reassembles/preempts a busy queue
#   mode 1 (NoPreemption) drops the conflicting packet and lets the burst keep assembling
# n = 3 is the near-nominal control: at 0.2s it already read 2.94 packets (4211 B), i.e. the
# truncation is present but small, which is what makes n = 6 a trend rather than an outlier.
#
# Cost: 3 granularities x 2 modes x repeat 5 = 30 run.
# ----------------------------------------------------------------------------
[Config ExpS-BurstLenPreempt]
extends = FDL-Scenario
description = "Batch 2: long-burst truncation at 2s, Dynamic vs NoPreemption, FDL off"
**.sat*.coreSwitch.useFDL = false
**.sat*.coreSwitch.fdlDelayTime = 34.4us
**.packetBurstifier[*].numPackets = ${numPackets = 1, 3, 6}
**.sat*.edgeRouter.obs.assembler.dispatcher.dispatchMode = ${edgeMode = 0, 1}
**.sat*.host.udpApp[0].sendInterval = exponential(35.6us)
repeat = 5
seed-set = ${runnumber}
result-dir = results/ExpS-BurstLenPreempt-release

# ----------------------------------------------------------------------------
# WEEK 14, RESEARCH DAY A - SENSITIVITY EXPERIMENTS (paper 5.5 / figure 8)
#
# Three arms, each testing one number that section 5.2/5.3/5.4 currently rests on.
# ----------------------------------------------------------------------------

# ARM S1 - WHERE DOES THE STATIC EDGE DROP COME FROM?
#
# The 8-queue / 10-destination edge is the DESIGN (params.ini). The 10-queue cells below are a
# counterfactual that isolates the mechanism; they are not a design variant and do not supply
# the paper's numbers.
#
# Week 13 measured the Static dispatcher dropping 14.21-14.27% of packets at every load with
# the delay line on or off, and Dynamic dropping none. Reading OBS_PacketDispatcher.cc shows
# why, and it is not a queue-occupancy threshold: mode 3 picks the queue as
# (targetLabel - 1) % numQueues, so with the scenario's 8 packet burstifiers serving 10
# destinations, labels 1 and 9 share queue 0 and labels 2 and 10 share queue 1. A packet whose
# label shares a queue with a burst already being assembled under the other label is dropped
# (the "queue busy with different label" branch), which is deterministic and load-insensitive.
#
# numPacketBurstifiers is a parameter of OBS_BurstAssembler, and the NED sizes the dispatcher
# gates, the burstifier array and the sender's input array from it, so raising it needs no
# source change and leaves src/EdgeNode/ untouched. It is NOT changed in params.ini: the
# 8-queue default stays the baseline and only this experiment asks for 10.
#
# Prediction under the shared-queue reading: at 10 queues the mapping is injective and the
# Static drop falls to ~0. Measured: 0.000%. Under the design's queue shortage the 14.2% is
# therefore the real cost of Static's fixed mapping, which Dynamic's reassignment avoids.
#
# Dynamic is carried along at both queue counts as the control: it must stay at 0 either way.
# useFDL is off throughout - week 13 already showed the drop is identical with the delay line
# on, and this arm is about the edge.
# ----------------------------------------------------------------------------
[Config ExpS-EdgeQueues]
extends = FDL-Scenario
description = "S1: Static vs Dynamic drop against 8 vs 10 edge queues"
**.sat*.edgeRouter.**.numPacketBurstifiers = ${nQueues = 8, 10}
**.sat*.edgeRouter.obs.assembler.dispatcher.dispatchMode = ${edgeMode = 3, 0}
**.sat*.coreSwitch.useFDL = false
**.sat*.host.udpApp[0].sendInterval = exponential(${meanInterval = 79.8us, 35.6us, 21.3us})
repeat = 5
seed-set = ${runnumber}
result-dir = results/ExpS-EdgeQueues-release

# ARM S2 - DOES THE tau/T_burst OPTIMUM SURVIVE A CHANGE OF GRANULARITY?
#
# Section 5.3's useful zone (tau/T_burst in [0.5, 2], peak at 1) was measured at one burst
# length: numPackets = 3, i.e. 4295 B and T_burst = 34.36 us at 1 Gbps. The width-2 tail of
# that claim is really a claim about granularity, and burst granularity is a known OBS result
# (laevens2003single, already read in week 9), so the sensitivity arm has to show whether the
# optimum we report sits at the same normalised place when the burst is 1, 3 or 6 packets.
#
# tau is DERIVED, not tabulated, so that the normalised ratio is the iteration variable and
# the absolute delay cannot drift between arms:
#   T_burst(n) = (1429 n + 8) bytes * 8 / 1 Gbps = (1429 n + 8) * 0.008 us
# The 1429 is measured, not assumed: 3 * 1428 B payload-plus-headers + 8 B burst header + 3 * 1 B
# per-packet header = 4295 B, which is exactly the mean burst length week 13 read back from
# carriedBytes/carriedBursts at n = 3.
#
# RATIO 0.85 EXISTS FOR THE n = 6 ARM. The 0.2s smoke showed that the realised burst length at
# n = 6 is 7321-7361 B, i.e. about 5.1 packets and NOT the nominal 8582 B, so a nominal tau of
# 1.0 * T_burst(6) buys a realised ratio of about 1.17. The shortfall is not the offset budget:
# repeating the arm with minOffset/maxOffset at 2ms/4ms left every n = 6 cell within 6 B of the
# 0.5ms/1ms values (Test-Smoke-BurstLenOffset). It is the Dynamic dispatcher cutting long bursts
# short when it reassigns or preempts a busy queue, which is exactly the mechanism the mode-3
# branch avoids and mode 0 does not. 0.85 = 58.7/68.66 therefore puts a point at realised
# ratio ~1.0 for n = 6, while costing nothing on the other two arms (n = 1 and n = 3 realise
# 0.85 and 0.87 there). Analysis must plot tau against the REALISED T_burst of each arm, which
# is why carriedBytes/carriedBursts is read back per cell before any curve is drawn.
#
# The packet rate is held fixed (same sendInterval values as the main grid) rather than the
# burst rate, so all three arms offer the same bytes to the channel and only the packing
# changes. Measured rho is reported per arm because the loss pattern does move it a little.
#
# minOffset = 500us still exceeds the largest tau here (2 * 68.66 = 137.3 us), so the
# "FDL loopback must not push a burst past its own BCP" constraint in fdl_params.ini holds.
# ----------------------------------------------------------------------------
[Config ExpS-BurstLen]
extends = FDL-Scenario
description = "S2: tau/T_burst 0.5/0.85/1/2 at 1, 3 and 6 packets per burst"
**.packetBurstifier[*].numPackets = ${numPackets = 1, 3, 6}
**.sat*.coreSwitch.useFDL = true
**.sat*.coreSwitch.fdlDelayTime = ${ratio = 0.5, 0.85, 1, 2} * (1429 * ${numPackets} + 8) * 0.008us
**.sat*.host.udpApp[0].sendInterval = exponential(${meanInterval = 35.6us, 21.3us})
repeat = 5
seed-set = ${runnumber}
result-dir = results/ExpS-BurstLen-release

# Same three granularities with no delay line, so each n gets its own reference at each load.
# Ratio is not an iteration variable here - the reference does not depend on tau - so this is
# 3 x 2 x 5 instead of 3 x 3 x 2 x 5.
[Config ExpS-BurstLen-NoFDL]
extends = FDL-Scenario
description = "S2 reference: no delay line at 1, 3 and 6 packets per burst"
**.packetBurstifier[*].numPackets = ${numPackets = 1, 3, 6}
**.sat*.coreSwitch.useFDL = false
**.sat*.host.udpApp[0].sendInterval = exponential(${meanInterval = 35.6us, 21.3us})
repeat = 5
seed-set = ${runnumber}
result-dir = results/ExpS-BurstLen-NoFDL-release

# ARM S3 - COMPLETE THE tau GRID AT THE HOTSPOT
#
# Scenario B (rho ~ 0.8074) was measured at tau/T = 0.5, 1, 2 in week 11 and the result was
# that the delay line buys 0.1-0.6 pp regardless of tau. With three points that plateau could
# still be a local flat spot, so this arm adds the two ends of the grid used on the main
# sweep (0.25 and 4) and nothing else.
#
# Standalone rather than "extends = ExpA-HotspotPoint" with a rewritten tau list: OMNeT++
# rejects redefining an inherited iteration variable, and the week-11 config must keep
# producing the same directory contents it produced then. The ten destAddresses lines are
# therefore repeated verbatim - they ARE the hotspot, and deriving them from the other config
# would make this arm silently follow any later edit to Scenario B.
#
# tau/T values: 8.6us = 0.25, 137.4us = 4 (T_burst = 34.36us).
# ----------------------------------------------------------------------------
[Config ExpA-HotspotGrid]
extends = FDL-Scenario
description = "Scenario B: the two tau grid ends (0.25 and 4) that week 11 did not cover"
**.sat1.host.udpApp[0].destAddresses  = "sat2.host"
**.sat2.host.udpApp[0].destAddresses  = "sat1.host"
**.sat3.host.udpApp[0].destAddresses  = "sat2.host"
**.sat4.host.udpApp[0].destAddresses  = "sat2.host"
**.sat5.host.udpApp[0].destAddresses  = "sat2.host"
**.sat6.host.udpApp[0].destAddresses  = "sat2.host"
**.sat7.host.udpApp[0].destAddresses  = "sat2.host"
**.sat8.host.udpApp[0].destAddresses  = "sat2.host"
**.sat9.host.udpApp[0].destAddresses  = "sat2.host"
**.sat10.host.udpApp[0].destAddresses = "sat2.host"
**.sat*.host.udpApp[0].sendInterval = exponential(19.5us)
**.sat*.coreSwitch.useFDL = ${fdl = false, true}
**.sat*.coreSwitch.fdlDelayTime = ${tauSweep = 8.6us, 137.4us}
repeat = 5
seed-set = ${runnumber}
result-dir = results/ExpA-HotspotGrid-release

# ----------------------------------------------------------------------------
# BATCH 3 (week 14, research day B) - REJECTION-REASON REBUILD
#
# Same cells, seeds and iteration order as the week 11/14 release batches. The only
# change is result-dir, so a child that overrides nothing else cannot pick up a new
# iteration axis. These exist so the new burstLoss* reason scalars can be recorded
# without overwriting the original directories, which stay the regression baseline.
# Open them only after the deterministic gates pass.
#   ExpA-TauSweep-Decomp        5 tau x 2 loads x 5          = 50
#   ExpA-AsyncTauSweep-Decomp   5 tau x 2 loads x 2 vf x 5   = 100
#   ExpA-HotspotPoint-Decomp    3 tau x 2 fdl x 5            = 30
#   ExpA-HotspotGrid-Decomp     2 tau x 2 fdl x 5            = 20
# ----------------------------------------------------------------------------
[Config ExpA-TauSweep-Decomp]
extends = ExpA-TauSweep
description = "Batch 3: sync tau sweep with the rejection-reason counters"
result-dir = results/ExpA-TauSweep-Decomp-release

[Config ExpA-AsyncTauSweep-Decomp]
extends = ExpA-AsyncTauSweep
description = "Batch 3: async tau sweep, Horizon and void filling, with rejection reasons"
result-dir = results/ExpA-AsyncTauSweep-Decomp-release

[Config ExpA-HotspotPoint-Decomp]
extends = ExpA-HotspotPoint
description = "Batch 3: hotspot tau points with the rejection-reason counters"
result-dir = results/ExpA-HotspotPoint-Decomp-release

[Config ExpA-HotspotGrid-Decomp]
extends = ExpA-HotspotGrid
description = "Batch 3: hotspot tau-grid ends with the rejection-reason counters"
result-dir = results/ExpA-HotspotGrid-Decomp-release
