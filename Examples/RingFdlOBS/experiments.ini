# ----- Experiment 4: TCP Throughput (High Load) -----
# 12 TCP flows → 8 queues (ρ=1.5), large requests for heavy dispatcher load
# 5000B request → TCP segments it into ~4 IP packets → high burst-fill rate
[Config TCPThroughput]
description = "TCP throughput: mode=${mode}"
**.dispatchMode = ${mode=0,1,2,3}

**.packetBurstifier[*].timeout = 0.01s
**.packetBurstifier[*].maxSize = 125000000B
**.packetBurstifier[*].numPackets = 1000
**.packetBurstifier[*].minSizeWithPadding = 500B

# sat1 = TCP client (12 flows), NO UDP
**.sat1.host.numUdpApps = 0
**.sat1.host.numPingApps = 0
**.sat1.host.numTcpApps = 12

# All other nodes = TCP server (echo), NO UDP
**.sat*.host.numUdpApps = 0
**.sat*.host.numPingApps = 0
**.sat*.host.numTcpApps = 1

# TCP client: large requests, many rounds, tiny reply → one-directional heavy load
**.sat1.host.tcpApp[*].typename = "TCPBasicClientApp"
**.sat1.host.tcpApp[*].connectPort = 1000
**.sat1.host.tcpApp[*].numRequestsPerSession = 500
**.sat1.host.tcpApp[*].requestLength = 5000B
**.sat1.host.tcpApp[*].replyLength = 100B
**.sat1.host.tcpApp[*].thinkTime = 0s
**.sat1.host.tcpApp[*].idleInterval = 60s

# 12 TCP flows to 9 destinations (sat2-sat4 get 2 flows each)
**.sat1.host.tcpApp[0].connectAddress = "sat2.host"
**.sat1.host.tcpApp[0].startTime = 0.5s
**.sat1.host.tcpApp[1].connectAddress = "sat3.host"
**.sat1.host.tcpApp[1].startTime = 0.51s
**.sat1.host.tcpApp[2].connectAddress = "sat4.host"
**.sat1.host.tcpApp[2].startTime = 0.52s
