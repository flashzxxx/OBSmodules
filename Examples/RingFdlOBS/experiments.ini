**.sat1.host.tcpApp[4].startTime = 0.54s
**.sat1.host.tcpApp[5].connectAddress = "sat7.host"
**.sat1.host.tcpApp[5].startTime = 0.55s
**.sat1.host.tcpApp[6].connectAddress = "sat8.host"
**.sat1.host.tcpApp[6].startTime = 0.56s
**.sat1.host.tcpApp[7].connectAddress = "sat9.host"
**.sat1.host.tcpApp[7].startTime = 0.57s
**.sat1.host.tcpApp[8].connectAddress = "sat10.host"
**.sat1.host.tcpApp[8].startTime = 0.58s
**.sat1.host.tcpApp[9].connectAddress = "sat2.host"
**.sat1.host.tcpApp[9].startTime = 0.59s
