# =========================================================================
# experiments.ini - Performance Comparison Experiments
# 4 strategies × multiple parameter sweeps
# dispatchMode: 0=Dynamic, 1=NoPreemption, 2=RoundRobin, 3=Static
# =========================================================================

# ----- Experiment 1: Flow Scaling with HIGH-FREQUENCY UDP -----
# Key design: sendInterval (0.002s) < burst timeout (0.01s)
# This ensures multiple packets arrive during burst assembly,
# so P1 (busy match) and burst aggregation actually matter.
[Config FlowScaling]
description = "Flow count scaling: ${flows} flows, mode=${mode}"
**.dispatchMode = ${mode=0,1,2,3}

# Burst assembly: 10ms timeout allows aggregating multiple packets
**.packetBurstifier[*].timeout = 0.01s
**.packetBurstifier[*].maxSize = 125000000B
**.packetBurstifier[*].numPackets = 1000
**.packetBurstifier[*].minSizeWithPadding = 500B

# Use UDP for high-frequency one-way traffic (no reply needed)
# OMNeT++ first-match-wins: specific sat1 BEFORE general sat*
**.sat1.host.numTcpApps = 0
**.sat1.host.numPingApps = 0
**.sat1.host.numUdpApps = ${flows=2,4,6,8,10,12}
**.sat*.host.numTcpApps = 0
**.sat*.host.numPingApps = 0
**.sat*.host.numUdpApps = 1

# Each UDP app sends to a different destination at HIGH FREQUENCY
# sendInterval=0.002s means 5 packets arrive within one burst timeout (0.01s)
**.sat1.host.udpApp[0].typename = "UDPBasicApp"
**.sat1.host.udpApp[0].destAddresses = "sat2.host"
**.sat1.host.udpApp[0].destPort = 5000
**.sat1.host.udpApp[0].localPort = 5001
**.sat1.host.udpApp[0].messageLength = 500B
**.sat1.host.udpApp[0].sendInterval = 0.002s
**.sat1.host.udpApp[0].startTime = 0.5s
