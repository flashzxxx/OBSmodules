# ============================================================================
# fdl_tests.ini - Task 2.3 functional verification of the FDL loopback
# ============================================================================
#
# These are deterministic single-contention tests, not performance runs. The
# goal is to prove that each of the three scheduling branches is reachable and
# behaves as designed, so the load-calibrated experiments in fdl_experiments.ini
# can be trusted afterwards.
#
# DETERMINISTIC CONTENTION SETUP
# ------------------------------
# sat1.host and sat5.host both send to sat3.host. Per config/core1Route.dat and
# config/core5Route.dat both paths meet at sat2 and leave on the same output
# port towards sat3:
#
#     sat1 --5ms--> sat2 --> sat3
#     sat5 --5ms--> sat2 --> sat3
#
# Both feeders are one ISL hop away with identical 5 ms propagation, so equal
# send times produce simultaneous arrival at sat2. sat5 is started 5 us late so
# that the second burst reliably lands inside the first burst's reservation
# rather than in an exact tie (findNearestLambda treats arrival == horizon as
# busy, which would make an exact tie ambiguous to interpret).
#
# One packet per burst gives a fixed burst of 1400B payload + 28B IP/UDP + 9B
# burst headers = 1437 B, i.e. T_burst = 11.5 us at 1 Gbps. The second burst
# therefore faces waitTime ~= 11.5 - 5 + 0.75*guardTime. With FDL-Scenario
# guardTime=2us that is ~8 us, and tau selects the branch:
#
#     tau = 20 us  ->  waitTime <= tau  ->  scenario B (loopback)
#     tau =  2 us  ->  waitTime >  tau  ->  scenario C (drop)
#
# HOW TO RUN (ini file must be omnetpp.ini so FDL-Scenario is included)
#   ../../out/gcc-release/obsmodules.exe -u Cmdenv -f omnetpp.ini \
#       -c Test-FDL-Basic -n "../..;.;D:/inet/src"
#
# Expected-to-fail configs (not part of ordinary regression):
#   Test-FDL-TauBelowSwitchTime, Test-FDL-TauZero, Test-FDL-PortStringOverflow
#
# WEEK 9 adds two deterministic scenes for the comparison arms, both at the end of this
# file: Test-VF-* (Horizon + void filling) and Test-Retransmit-* (bufferless retransmission).
# Both arms default to off; with them off this file reproduces the week-8 .sca exactly.
# ============================================================================

# ----------------------------------------------------------------------------
# Shared deterministic two-source contention pattern.
# ----------------------------------------------------------------------------
[Config FDL-TestBase]
extends = FDL-Scenario
description = "Deterministic sat1+sat5 -> sat3 contention at sat2"

# Keep the tau>=switchReconfigTime check off so Test-FDL-TooShort (tau=2us)
# still starts after FDL-Scenario sets switchReconfigTime=2us.
**.sat*.coreSwitch.switchReconfigTime = 0s

# One packet per burst so burst boundaries are exactly predictable.
**.packetBurstifier[*].numPackets = 1
**.packetBurstifier[*].timeout = 1s

# Only sat1 and sat5 source traffic; sat3 sinks it; everyone else is silent.
# Each source sends exactly one packet: stopTime is before the next 1 ms tick.
**.sat1.host.numUdpApps = 1
**.sat5.host.numUdpApps = 1
**.sat3.host.numUdpApps = 1
**.sat*.host.numUdpApps = 0

**.sat1.host.udpApp[0].typename = "UDPBasicApp"
**.sat1.host.udpApp[0].destAddresses = "sat3.host"
**.sat1.host.udpApp[0].destPort = 5000
**.sat1.host.udpApp[0].localPort = 5001
**.sat1.host.udpApp[0].messageLength = 1400B
**.sat1.host.udpApp[0].sendInterval = 1ms
**.sat1.host.udpApp[0].startTime = 0.1s
**.sat1.host.udpApp[0].stopTime = 0.1005s

**.sat5.host.udpApp[0].typename = "UDPBasicApp"
**.sat5.host.udpApp[0].destAddresses = "sat3.host"
**.sat5.host.udpApp[0].destPort = 5000
**.sat5.host.udpApp[0].localPort = 5001
**.sat5.host.udpApp[0].messageLength = 1400B
**.sat5.host.udpApp[0].sendInterval = 1ms
**.sat5.host.udpApp[0].startTime = 0.100005s
**.sat5.host.udpApp[0].stopTime = 0.1005s

**.sat3.host.udpApp[0].typename = "UDPSink"
**.sat3.host.udpApp[0].localPort = 5000

sim-time-limit = 0.2s

# Full event log for the contended node, so the two OXC reservations and the
# BCP offset update can be checked by hand against the expected timings.
cmdenv-express-mode = false
**.sat2.coreSwitch.**.cmdenv-ev-output = true


# ----------------------------------------------------------------------------
# Test 1: the loopback branch is reached and behaves correctly.
#
# PASS CRITERIA
#   sat2 fdlUsageCount  > 0
#   sat2 burstLossContention == 0   (every contending burst is rescued)
#   sat3 receives every packet sent by both sources
#   EV log at sat2 shows, per rescued burst, two OXC reservations whose second
#   connect time is exactly tau after the first, and a BCP offset increased by
#   exactly tau
# ----------------------------------------------------------------------------
[Config Test-FDL-Basic]
extends = FDL-TestBase
description = "FDL ON, tau > waitTime: contending bursts must loop back"
**.sat*.coreSwitch.useFDL = true
**.sat*.coreSwitch.fdlDelayTime = 20us


# ----------------------------------------------------------------------------
# Test 2: the drop branch is still reachable when tau is too short.
#
# Without this test a passing Test-FDL-Basic could equally be explained by an
# FDL that unconditionally accepts everything.
#
# PASS CRITERIA
#   sat2 fdlUsageCount == 0
#   sat2 burstLossContention > 0
#   loss count matches Test-FDL-Off exactly (tau too short == no FDL)
# ----------------------------------------------------------------------------
[Config Test-FDL-TooShort]
extends = FDL-TestBase
description = "FDL ON, tau < waitTime: loopback must be refused and burst dropped"
**.sat*.coreSwitch.useFDL = true
**.sat*.coreSwitch.fdlDelayTime = 2us


# ----------------------------------------------------------------------------
# Test 3: the switch really disables the feature.
#
# PASS CRITERIA
#   sat2 fdlUsageCount == 0
#   sat2 burstLossContention > 0
#   every scalar identical to Test-FDL-TooShort
# ----------------------------------------------------------------------------
[Config Test-FDL-Off]
extends = FDL-TestBase
description = "FDL OFF: baseline drop-on-contention behaviour"
**.sat*.coreSwitch.useFDL = false
**.sat*.coreSwitch.fdlDelayTime = 20us


# ----------------------------------------------------------------------------
# Test 4: backward compatibility of the untouched path.
#
# This one deliberately does NOT extend FDL-Scenario. It re-runs the phase-1
# ICMPTest unchanged so the result can be compared against a build from before
# the FDL work existed. Extending the new scenario would change the traffic and
# defeat the purpose.
#
# PROCEDURE
#   1. git stash / checkout the pre-FDL commit, build, run ICMPTest, keep the .sca
#   2. return to the FDL branch, build, run this config
#   3. diff the two .sca files; only the new FDL/utilisation scalars may differ,
#      and all FDL counters must read zero
#
# PASS CRITERIA
#   fdlUsageCount == 0 on every core node
#   every scalar that existed before the FDL work is bit-identical
# ----------------------------------------------------------------------------
[Config Test-FDL-Compatibility]
extends = ICMPTest
description = "Phase-1 ICMPTest with FDL explicitly off: must match the pre-FDL baseline"
**.sat*.coreSwitch.useFDL = false
warmup-period = 0s


# ----------------------------------------------------------------------------
# Expected-to-fail: tau shorter than the switch reconfiguration time.
# OBS_CoreControlLogic::initialize() must opp_error. Not part of regression.
#
# Replaces the former Test-FDL-TauMismatch, which could not fail: it set
# fdl.delayTime while OBS_CoreNode.ned binds that submodule parameter as
# `delayTime = fdlDelayTime`, and an ini entry cannot override a NED
# submodule-block assignment (checked 2026-09-17: a wildcard pattern and a
# fully-qualified path both left the model unchanged, so that config ran to
# completion and produced scalars identical to Test-FDL-Basic).
# ----------------------------------------------------------------------------
[Config Test-FDL-TauBelowSwitchTime]
extends = Test-FDL-Basic
description = "EXPECTED FAIL: fdlDelayTime (20us) < switchReconfigTime"
**.sat*.coreSwitch.switchReconfigTime = 30us


# ----------------------------------------------------------------------------
# Expected-to-fail: useFDL=true with a non-positive tau.
# OBS_CoreControlLogic::initialize() must opp_error.
# ----------------------------------------------------------------------------
[Config Test-FDL-TauZero]
extends = Test-FDL-Basic
description = "EXPECTED FAIL: useFDL=true with fdlDelayTime = 0s"
**.sat*.coreSwitch.fdlDelayTime = 0s


# ----------------------------------------------------------------------------
# Stay-Offset loopback: BCP is held by tau so downstream offset matches
# cut-through. EV at sat2: offset formula without +tau; BCP leaves tau later
# than in Test-FDL-Basic.
# ----------------------------------------------------------------------------
[Config Test-FDL-SO]
extends = Test-FDL-Basic
description = "FDL ON, Stay-Offset: hold BCP by tau"
**.sat*.coreSwitch.fdlOffsetMode = "SO"


# ----------------------------------------------------------------------------
# Expected-to-fail: lambdasPerOutPort has more tokens than numPorts.
# GatesHorizon initialize() must opp_error. Do not include in ordinary regression.
# ----------------------------------------------------------------------------
[Config Test-FDL-PortStringOverflow]
extends = Test-FDL-Basic
description = "EXPECTED FAIL: lambdasPerOutPort token count != numPorts"
**.sat2.coreSwitch.lambdasPerOutPort = "1 1 1 1 1"


# ============================================================================
# Loaded-traffic diagnostics (not pass/fail tests).
#
# These came out of the 2026-09-18 root-cause hunt, when ExpA-Pilot / ExpA-NoFDL
# / FDL-Calibrate all died at t~1.9ms with
#   "Attempting to schedule an already scheduled input channel. Channel id: 0."
# Cause: H1 raised guardTime only under the coreSwitch pattern, leaving the edge
# OBS_BurstSender at params.ini's 1ns. The core reserves an input window of
# D + 3*guard/4 while the sender paced bursts D + guard apart, so consecutive
# windows on the same input port overlapped by 1.50us - always on inGate0, the
# local edge port, and always to two different outPorts so the output horizon
# never caught it.
#
# Run these if a loaded (non-deterministic) config starts aborting: Guard2us is
# expected to fail while the guard is inconsistent, GuardBoth is the fixed case.
#   Test-FDL-Diag-Guard2us   EXPECTED FAIL - reproduces the bug (core 2us/edge 1ns)
#   Test-FDL-Diag-Guard1ns   Week-5 guard on both sides -> passes
#   Test-FDL-Diag-Burst1pkt  bug + 1 packet/burst -> still fails, excludes burst size
#   Test-FDL-Diag-GuardBoth  the fix -> must PASS
# Each writes to results/_diag so real experiment output is never touched.
# Both guards are stated explicitly here on purpose: inheriting either one from
# FDL-Scenario would silently change what these configs test.
# ============================================================================
[Config Test-FDL-Diag-Guard2us]
extends = ExpA-NoFDL
description = "DIAGNOSTIC: EXPECTED FAIL - core guard 2us while the sender is 1ns"
**.sat*.coreSwitch.**.guardTime = 2us
**.sat*.**.sender.guardTime = 1ns
result-dir = results/_diag

[Config Test-FDL-Diag-Guard1ns]
extends = ExpA-NoFDL
description = "DIAGNOSTIC: the Week-5 guard (1ns) on both sides - passes"
**.sat*.coreSwitch.**.guardTime = 1ns
**.sat*.**.sender.guardTime = 1ns
result-dir = results/_diag

[Config Test-FDL-Diag-Burst1pkt]
extends = ExpA-NoFDL
description = "DIAGNOSTIC: bug case with one packet per burst - excludes burst size"
**.sat*.coreSwitch.**.guardTime = 2us
**.sat*.**.sender.guardTime = 1ns
**.packetBurstifier[*].numPackets = 1
result-dir = results/_diag

[Config Test-FDL-Diag-GuardBoth]
extends = ExpA-NoFDL
description = "DIAGNOSTIC: the fix - sender guard aligned with the core guard"
**.sat*.coreSwitch.**.guardTime = 2us
**.sat*.**.sender.guardTime = 2us
result-dir = results/_diag


# ============================================================================
# Single-loopback red-line check.
#
# AGENTS.md: "单次回环：FDL 最大回环次数为 1，不实现多次回环." The parameter must
# therefore be 1. With -1 (unlimited) a burst can loop once at EVERY node on its
# path, because the BCP carries fdlLoopCount across nodes. Measured 2026-09-18 on
# ExpA-TauSweep: 147,935 multi-loop events under -1, none under 1 -- and the
# choice moved the loss rate by up to 3.7 percentage points, so it is not
# cosmetic. Both configs state the value explicitly so a change to the
# FDL-Scenario default cannot silently alter what these check.
#   Test-FDL-Diag-LoopLoose   EXPECTED to record burstsLoopedMultiple > 0
#   Test-FDL-Diag-LoopStrict  must record burstsLoopedMultiple == 0
# Heavy cell (tau/T_burst = 4, the heaviest load) so multi-looping actually
# happens if it is allowed.
# ============================================================================
[Config Test-FDL-Diag-LoopStrict]
extends = FDL-Scenario
description = "DIAGNOSTIC: red line enforced - burstsLoopedMultiple must be 0"
**.sat*.coreSwitch.useFDL = true
**.sat*.coreSwitch.fdlDelayTime = 137.4us
**.sat*.host.udpApp[0].sendInterval = exponential(21.3us)
**.sat*.coreSwitch.maxFdlLoopsPerBurst = 1
repeat = 1
seed-set = 0
result-dir = results/_diag

[Config Test-FDL-Diag-LoopLoose]
extends = Test-FDL-Diag-LoopStrict
description = "DIAGNOSTIC: EXPECTED burstsLoopedMultiple > 0 - the old -1 setting"
**.sat*.coreSwitch.maxFdlLoopsPerBurst = -1

# ============================================================================
# WEEK 9 / ARM 1 - Horizon + void filling (Test-VF-*)
#
# Three feeders share sat2's single output channel towards sat3, and their arrival
# times are placed so that the third one lands in a hole rather than being a
# near-miss. Timings (seconds, relative to the common host-send origin):
#
#   A sat1.host  send 0.100000  maxOffset  700us ->  BCP@sat2 0.105000  burst 0.105700
#   B sat5.host  send 0.100010  maxOffset 1000us ->  BCP@sat2 0.105010  burst 0.106010
#   C sat2.host  send 0.105020  maxOffset  900us ->  BCP@sat2 0.105020  burst 0.105920
#
# BCP order is A, B, C (identical edge chains, A and B also pay the 5ms ISL and 1us of
# core processing each); burst order is A, C, B. A reserves [0.105699, 0.105712] and B
# reserves [0.106009, 0.106022], so the channel is free only in (0.105712, 0.106009).
# C's own window is [0.105919, 0.105932]: inside that hole, and its BCP is processed
# last, when the scalar horizon already sits at B's end. The horizon rule must therefore
# refuse C while void filling must admit it - same three bursts, one admission rule
# apart. That is what makes this a test of the scheduler and not of the traffic.
#
# The effective offset of a burst is the burstifier's maxOffset: OBS_BurstSender schedules
# at maxOffset and uses minOffset only for the drop check, which is why minOffset is set
# just below maxOffset (equal values drop every burst as "reaching Minimum Offset").
# ============================================================================
[Config VF-TestBase]
extends = FDL-TestBase
description = "Deterministic void filling scene: three feeders, the third lands in a hole"

# sat2 sources traffic of its own, so its local edge port drives the same output channel
# as the two ISL feeders.
**.sat2.host.numUdpApps = 1
**.sat2.host.udpApp[0].typename = "UDPBasicApp"
**.sat2.host.udpApp[0].destAddresses = "sat3.host"
**.sat2.host.udpApp[0].destPort = 5000
**.sat2.host.udpApp[0].localPort = 5001
**.sat2.host.udpApp[0].messageLength = 1400B
**.sat2.host.udpApp[0].sendInterval = 1ms
**.sat2.host.udpApp[0].startTime = 0.105020s
**.sat2.host.udpApp[0].stopTime = 0.105520s

# Per-feeder offsets place the three bursts in time; per-feeder start times order the BCPs.
**.sat1.**.packetBurstifier[*].minOffset = 699us
**.sat1.**.packetBurstifier[*].maxOffset = 700us
**.sat5.**.packetBurstifier[*].minOffset = 999us
**.sat5.**.packetBurstifier[*].maxOffset = 1000us
**.sat2.**.packetBurstifier[*].minOffset = 899us
**.sat2.**.packetBurstifier[*].maxOffset = 900us

**.sat1.host.udpApp[0].startTime = 0.100000s
**.sat1.host.udpApp[0].stopTime = 0.100500s
**.sat5.host.udpApp[0].startTime = 0.100010s
**.sat5.host.udpApp[0].stopTime = 0.100510s

# FDL stays off here so the scene isolates the scheduler: a loopback would rescue C for a
# different reason. Test-VF-FDLOn turns it on deliberately to show it does not.
**.sat*.coreSwitch.useFDL = false


# PASS CRITERIA: sat2 core burstLossContention == 1, sat3's UDP sink receives 2 of the 3
# requests, and sat2 records no voidFilledBursts (the scalar is only written when the
# option is on, so its absence is itself part of the check).
[Config Test-VF-Off]
extends = VF-TestBase
description = "PASS: the horizon rule refuses the third burst - contention drop 1, 2 of 3 delivered"
**.sat*.coreSwitch.enableVoidFilling = false


# PASS CRITERIA: sat2 core burstLossContention == 0, sat3's UDP sink receives 3 of 3,
# sat2 voidFilledBursts == 1 (the burst really went into the hole, it was not admitted by
# some other route), and fdlUsageCount == 0 (FDL is off here).
[Config Test-VF-On]
extends = VF-TestBase
description = "PASS: void filling admits the third burst into the hole - contention drop 0, 3 of 3 delivered"
**.sat*.coreSwitch.enableVoidFilling = true


# The interesting control: with the FDL available, is the third burst rescued by the
# loopback instead of by the scheduler? No - its wait is ~103us against tau = 20us, so the
# loopback is refused and the burst is dropped. Turning void filling on admits it directly,
# which is why fdlUsageCount must stay 0 in that case: the scheduler, not the delay line,
# is what changed the outcome.
[Config Test-VF-FDLOn]
extends = VF-TestBase
description = "PASS: FDL available but unused - void filling admits the third burst directly, fdlUsageCount 0"
**.sat*.coreSwitch.useFDL = true
**.sat*.coreSwitch.fdlDelayTime = 20us
**.sat*.coreSwitch.enableVoidFilling = true

[Config Test-VF-FDLOnNoVF]
extends = Test-VF-FDLOn
description = "CONTROL: FDL on, void filling off - the third burst is still dropped and the FDL does not rescue it"
**.sat*.coreSwitch.enableVoidFilling = false


# ----------------------------------------------------------------------------
# Loaded diagnostic for the void filling calendar.
#
# The deterministic scene proves the decision rule; this one proves the data structure
# survives real load (thousands of reservations per channel, front pruning active) and
# reports what it costs. Not a pass/fail test: read the pair and compare.
#   calendarScanCount / calendarMaxReservations in the two .sca files are the LAUC-VF
#   cost evidence the compute-budget red line needs; voidFilledBursts counts how many
#   bursts only the calendar could admit.
# ----------------------------------------------------------------------------
[Config Test-VF-Diag-LoadedOff]
extends = FDL-Scenario
description = "DIAGNOSTIC: loaded all-to-all at rho~0.59, horizon scheduler (baseline)"
**.sat*.coreSwitch.useFDL = false
**.sat*.coreSwitch.enableVoidFilling = false
**.sat*.host.udpApp[0].sendInterval = exponential(21.3us)
sim-time-limit = 0.2s
repeat = 2
seed-set = ${runnumber}
result-dir = results/_diag

[Config Test-VF-Diag-LoadedOn]
extends = Test-VF-Diag-LoadedOff
description = "DIAGNOSTIC: identical load with void filling on - calendar under load"
**.sat*.coreSwitch.enableVoidFilling = true

# ----------------------------------------------------------------------------
# The previous pair answered a question nobody had asked yet, and the answer is
# important: under load, void filling admitted exactly nothing (voidFilledBursts = 0,
# identical loss to the horizon scheduler). The reason is the offset model, not the
# calendar. OBS_BurstSender always places the burst exactly maxOffset after its BCP, so
# every burst in FDL-Scenario has the same offset (1 ms) and burst arrival order is
# identical to BCP processing order. When that holds, no burst can ever be refused by the
# horizon rule and still fit somewhere: every reservation already made ends after the new
# burst's window starts whenever the horizon blocks it. Void filling can only pay off if
# arrivals and BCPs are out of order, i.e. if different sources use different offsets.
#
# This pair makes the offsets heterogeneous (one value per satellite, 700us to 970us) and
# leaves everything else alone. If the hypothesis is right, voidFilledBursts becomes
# positive and VF recovers part of the loss; if it stays 0, the calendar is not the
# explanation and the whole arm needs rethinking before the week-10 grid freeze.
# ----------------------------------------------------------------------------
[Config Test-VF-Diag-SpreadOffsetsOff]
extends = Test-VF-Diag-LoadedOff
description = "DIAGNOSTIC: loaded, one distinct offset per source - voids become usable"
**.sat1.**.packetBurstifier[*].minOffset = 699us
**.sat1.**.packetBurstifier[*].maxOffset = 700us
**.sat2.**.packetBurstifier[*].minOffset = 729us
**.sat2.**.packetBurstifier[*].maxOffset = 730us
**.sat3.**.packetBurstifier[*].minOffset = 759us
**.sat3.**.packetBurstifier[*].maxOffset = 760us
**.sat4.**.packetBurstifier[*].minOffset = 789us
**.sat4.**.packetBurstifier[*].maxOffset = 790us
**.sat5.**.packetBurstifier[*].minOffset = 819us
**.sat5.**.packetBurstifier[*].maxOffset = 820us
**.sat6.**.packetBurstifier[*].minOffset = 849us
**.sat6.**.packetBurstifier[*].maxOffset = 850us
**.sat7.**.packetBurstifier[*].minOffset = 879us
**.sat7.**.packetBurstifier[*].maxOffset = 880us
**.sat8.**.packetBurstifier[*].minOffset = 909us
**.sat8.**.packetBurstifier[*].maxOffset = 910us
**.sat9.**.packetBurstifier[*].minOffset = 939us
**.sat9.**.packetBurstifier[*].maxOffset = 940us
**.sat10.**.packetBurstifier[*].minOffset = 969us
**.sat10.**.packetBurstifier[*].maxOffset = 970us

[Config Test-VF-Diag-SpreadOffsetsOn]
extends = Test-VF-Diag-SpreadOffsetsOff
description = "DIAGNOSTIC: same heterogeneous offsets with void filling on"
**.sat*.coreSwitch.enableVoidFilling = true

# ============================================================================
# WEEK 9 / ARM 2 - bufferless retransmission (Test-Retransmit-*)
#
# The same two-source contention as Test-FDL-TooShort, but the sources are the host-side
# retransmission app and the destination acknowledges every request. sat5's burst is
# dropped at sat2; nothing tells sat5, so its retransmit timer is the only way that request
# can still be delivered.
#
#   sat1 request  first sent 0.100000 -> delivered      -> ack back at ~0.121s
#   sat5 request  first sent 0.100005 -> DROPPED at sat2
#   sat5 timer fires at 0.130005      -> retransmitted  -> delivered at ~0.141s
#
# retransmitTimeout = 30ms sits above the 2-hop round trip (10ms each way plus burst
# assembly and switching), so a retransmission cannot overtake a copy that is still in
# flight. That distinction matters: too short a timeout measures the app's impatience, not
# the network's loss.
# ============================================================================
[Config Retransmit-TestBase]
extends = FDL-TestBase
description = "Deterministic bufferless retransmission scene: one request is dropped at sat2"
**.sat*.coreSwitch.useFDL = false
**.sat1.host.udpApp[0].typename = "obsmodules.src.Retransmit.OBS_RetransmitSource"
**.sat5.host.udpApp[0].typename = "obsmodules.src.Retransmit.OBS_RetransmitSource"
**.sat3.host.udpApp[0].typename = "obsmodules.src.Retransmit.OBS_RetransmitSink"
**.sat3.host.udpApp[0].ackLength = 64B
**.sat1.host.udpApp[0].retransmitTimeout = 30ms
**.sat5.host.udpApp[0].retransmitTimeout = 30ms


# PASS CRITERIA: sat2 core burstLossContention == 1 (the drop really happened),
# sat5 retransmissionsSent == 1 and requestsAcked == 1, sat1 retransmissionsSent == 0
# (its request was never lost, so the timeout is not firing spuriously),
# sat3 OBS_RetransmitSink requestsReceived == 2, and deliveryRatio == 1 on both sources.
[Config Test-Retransmit-On]
extends = Retransmit-TestBase
description = "PASS: retransmission recovers the dropped request - deliveryRatio 1.0, one retransmission"
**.sat1.host.udpApp[0].maxRetransmissions = 3
**.sat5.host.udpApp[0].maxRetransmissions = 3


# The control that makes the previous config mean something: the same app, same acks, same
# timeout, but the retry cap at 0. The lost request is then abandoned, so the recovery in
# Test-Retransmit-On can only come from the retransmission and not from the app's presence.
#
# PASS CRITERIA: sat2 burstLossContention == 1, sat5 retransmissionsSent == 0,
# sat5 requestsAbandoned == 1, deliveryRatio 0.5 on sat5 and 1.0 on sat1, sat3 receives 1.
[Config Test-Retransmit-Off]
extends = Retransmit-TestBase
description = "CONTROL: retry cap 0 - the dropped request is given up, deliveryRatio 0.5"
**.sat1.host.udpApp[0].maxRetransmissions = 0
**.sat5.host.udpApp[0].maxRetransmissions = 0


# ----------------------------------------------------------------------------
# Loaded diagnostic for the retransmission arm.
#
# The deterministic scene proves the recovery path; this one proves the arm runs at real
# load (hundreds of outstanding requests per source, an acknowledgement per request through
# the same congested constellation). Smoke only - it is NOT an experiment R result and its
# numbers must not be reported as one; the week-11 batch is ExpR-Retransmit at 2s.
# ----------------------------------------------------------------------------
[Config Test-Retransmit-Diag-Loaded]
extends = ExpR-Retransmit
description = "DIAGNOSTIC: loaded retransmission arm, 0.2s smoke - not an ExpR result"
sim-time-limit = 0.2s
repeat = 1
seed-set = 0
result-dir = results/_diag

# ----------------------------------------------------------------------------
# Smoke check for the asynchronous-offset arm.
#
# It exists so the arm is never first executed at 2s scale: this runs the same iteration
# structure (tau x load x scheduler) at 0.2s into results/_diag. The iteration variables
# cannot be narrowed here - OMNeT++ rejects redefining an inherited iteration variable - so
# it is 3 x 2 x 2 = 12 short runs rather than one.
# ----------------------------------------------------------------------------
[Config Test-VF-Diag-AsyncPilotSmoke]
extends = ExpA-AsyncTauSweep
description = "DIAGNOSTIC: 0.2s smoke of the asynchronous-offset arm - not a result"
sim-time-limit = 0.2s
repeat = 1
seed-set = 0
result-dir = results/_diag

# ----------------------------------------------------------------------------
# Experiment R stability smoke.
#
# It exists because the retransmission arm has a failure mode the loopback arm does not:
# offering more than the network can carry makes its backlog grow without bound, and on a
# 32-bit build that ends in an access violation rather than an error message. Run this (it is
# 0.5s at both stable loads) and check the log's 'present:' message count is flat before
# spending two hours on the 2s batch. On 2026-09-22 the unhealthy configuration showed
# 47k -> 729k live messages; a healthy arm holds 16-19k.
# ----------------------------------------------------------------------------
[Config Test-ExpR-Diag-Smoke]
extends = ExpR-Retransmit
description = "DIAGNOSTIC: 0.5s experiment R stability smoke - check the live message count"
sim-time-limit = 0.5s
repeat = 1
seed-set = 0
result-dir = results/_diag
