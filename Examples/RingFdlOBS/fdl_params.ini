# ============================================================================
# fdl_params.ini - Shared scenario base for the phase-2/3 FDL work
# ============================================================================
#
# WHY THIS FILE EXISTS
# --------------------
# params.ini / experiments.ini are the phase-1 baseline and must stay
# reproducible, so nothing here is written into [General]. Every setting lives
# inside a [Config] section that the FDL tests and experiments inherit from.
#
# Three defects of the phase-1 scenario are corrected here, all of which would
# otherwise make the FDL experiments produce empty results:
#
#   1. W=1 violation. params.ini sets lambdasCore1to2 = 3, i.e. the single most
#      congested ISL of the whole topology is also the only one that breaks the
#      W=1 red line. Restored to 1 below.
#   2. Offered load ~0.24%. Phase-1 traffic is 12 flows x 500B / 2ms = 24 Mbps
#      against a 10 Gbps channel. At that load no contention occurs, so FDL is
#      never invoked and a tau sweep returns a flat line. Replaced by an
#      all-to-all load-parameterised traffic model below.
#   3. Deterministic traffic. Fixed sendInterval and fixed startTime make every
#      repetition identical, so seeds and confidence intervals are meaningless.
#      Send process is now exponential and start times are jittered.
#
# OPERATING POINT AND WHY THE CHANNEL RATE IS 1 Gbps
# --------------------------------------------------
# The satellite payload constraint on FDL fibre length couples the line rate to
# the burst size. With n = 1.468, light travels 2.04e8 m/s in fibre, so
#
#     fibre length L = tau * 2.04e8 m
#
# FDL only resolves contention when tau is of the order of one burst duration
# (a burst that has to wait longer than tau is dropped anyway), and
# T_burst = burstBytes * 8 / C. Combining the two:
#
#     L ~ burstBytes * 8 / C * 2.04e8
#
# A ~1 km coil is the realistic payload budget, which at C = 10 Gbps allows
# bursts up to ~6 kB, and at C = 1 Gbps only ~600 B. The physical design point
# of this study is therefore C = 10 Gbps with ~4 kB bursts.
#
# Simulating 10 Gbps at rho = 0.5 through the INET host stack would require
# ~2.7 M packets/s, which is not tractable. The FDL scheduling dynamics depend
# only on the dimensionless ratios (rho, tau/T_burst, offset/T_burst), so the
# sweeps are run at C = 1 Gbps and reported in normalised tau/T_burst units.
# FDL-RateCheck in fdl_experiments.ini re-runs one point at 10 Gbps to confirm
# the normalisation holds; tools/fdl_design.py converts the normalised results
# back to physical fibre lengths at 10 Gbps.
#
# Derived quantities at C = 1 Gbps (see tools/fdl_design.py):
#   burst = 3 x 1400B UDP payload + IP/UDP + burst headers ~= 4295 B
#   T_burst = 4295 * 8 / 1e9 = 34.4 us
# ============================================================================

# ----------------------------------------------------------------------------
# FDL-Scenario: abstract base. Do not run directly; extend it.
# ----------------------------------------------------------------------------
[Config FDL-Scenario]
description = "Base scenario for FDL tests and experiments (W=1, calibrated load)"
network = RingFdlOBS

# ============ W=1 freeze ============
# 1 data channel per ISL. The NED builds lambdasCoreXtoY+1 parallel fibres per
# link, where the +1 is the control channel carrying BCPs, so 1 here means
# exactly one data wavelength as required by the W=1 red line.
#
# Every ISL lambda and every coreSwitch port string is set here, not only the
# sat1/sat2 pair that params.ini currently breaks. FDL-Scenario must not depend
# on General remaining "mostly 1": a later params.ini edit would otherwise leak
# extra wavelengths into the FDL experiments with no compile-time warning.
**.lambdasCore1to2 = 1
**.lambdasCore2to3 = 1
**.lambdasCore4to5 = 1
**.lambdasCore5to6 = 1
**.lambdasCore6to7 = 1
**.lambdasCore8to9 = 1
**.lambdasCore9to10 = 1
**.lambdasCore1to4 = 1
**.lambdasCore2to5 = 1
**.lambdasCore3to6 = 1
**.lambdasCore5to8 = 1
**.lambdasCore6to9 = 1
**.lambdasCore7to10 = 1

# Port0 = local edge; remaining ports = ISL neighbours. All entries are 1.
**.sat1.coreSwitch.lambdasPerInPort  = "1 1 1"
**.sat1.coreSwitch.lambdasPerOutPort = "1 1 1"
**.sat2.coreSwitch.lambdasPerInPort  = "1 1 1 1"
**.sat2.coreSwitch.lambdasPerOutPort = "1 1 1 1"
**.sat3.coreSwitch.lambdasPerInPort  = "1 1 1"
**.sat3.coreSwitch.lambdasPerOutPort = "1 1 1"
**.sat4.coreSwitch.lambdasPerInPort  = "1 1 1"
**.sat4.coreSwitch.lambdasPerOutPort = "1 1 1"
**.sat5.coreSwitch.lambdasPerInPort  = "1 1 1 1 1"
**.sat5.coreSwitch.lambdasPerOutPort = "1 1 1 1 1"
**.sat6.coreSwitch.lambdasPerInPort  = "1 1 1 1 1"
**.sat6.coreSwitch.lambdasPerOutPort = "1 1 1 1 1"
**.sat7.coreSwitch.lambdasPerInPort  = "1 1 1"
**.sat7.coreSwitch.lambdasPerOutPort = "1 1 1"
**.sat8.coreSwitch.lambdasPerInPort  = "1 1 1"
**.sat8.coreSwitch.lambdasPerOutPort = "1 1 1"
**.sat9.coreSwitch.lambdasPerInPort  = "1 1 1 1"
**.sat9.coreSwitch.lambdasPerOutPort = "1 1 1 1"
**.sat10.coreSwitch.lambdasPerInPort  = "1 1 1"
**.sat10.coreSwitch.lambdasPerOutPort = "1 1 1"

# ============ Optical channel ============
# Plain values, not ${} iteration variables: derived configs override these
# directly, and inherited iteration variables would otherwise collide with the
# sweeps declared in fdl_experiments.ini.
**.sat*.coreSwitch.**.dataRate = 1Gbps
**.sender.dataRate = 1Gbps

# Guard time must cover OXC reconfiguration. params.ini leaves this at 1ns,
# which is not a payload-feasible protection interval. Assumed 2us pending D1
# (Zhao 2022 switch-setup order of magnitude). switchReconfigTime is the tau
# lower bound used when useFDL=true; FDL-TestBase overrides it to 0s.
**.sat*.coreSwitch.**.guardTime = 2us
**.sat*.coreSwitch.switchReconfigTime = 2us

# The edge burst sender MUST carry the same guard. The core reserves an input
# window of [arrival - g/2, arrival + D + g/4], i.e. D + 3g/4 wide, while the
# sender paces consecutive bursts D + guardTime apart. Leaving the sender at
# params.ini's 1ns makes it emit bursts D + 1ns apart, so consecutive windows on
# the same input port overlap by 3g/4 - 1ns. That trips
# "Attempting to schedule an already scheduled input channel" in the OXC as soon
# as any node's local edge port runs near 100% utilisation.
#
# Measured 2026-09-18 on ExpA-NoFDL/ExpA-Pilot/FDL-Calibrate: 12 overlaps, every
# one exactly 1.50us (= 3g/4 for g=2us), all on inGate0 which is port0, the local
# edge port; the colliding pair always went to two different outPorts, so the
# output horizon never caught it. H1 (2026-09-15) raised guardTime only under the
# coreSwitch pattern and missed this module; this line closes that gap.
**.sat*.**.sender.guardTime = 2us

# Exclude the ~25ms longest-path fill. Do not put this in [General].
warmup-period = 50ms

# BCP electronic processing per core node. params.ini leaves this at 0s, which
# makes the offset budget infinite and would let experiment C "prove" that
# offset=0 works for free. A non-zero value is required for any offset result
# to mean anything.
**.sat*.coreSwitch.**.BCPProcessingDelay = 1us
**.OEConversionDelay = 0s
**.EOConversionDelay = 0s

# ============ Burst assembly ============
# 3 packets per burst gives ~4.3 kB, i.e. T_burst = 34.4 us at 1 Gbps. Timeout
# is deliberately far above the packet interarrival time so that numPackets is
# the trigger and the burst size distribution stays narrow: burst length enters
# the FDL admission test through waitTime, so a wide distribution would blur
# the tau sweep.
**.packetBurstifier[*].numPackets = 3
**.packetBurstifier[*].timeout = 0.01s
**.packetBurstifier[*].maxSize = 125000000B
**.packetBurstifier[*].minSizeWithPadding = 500B
**.packetBurstifier[*].overflowLastPacket = true

# Offset must stay above the accumulated per-hop BCP processing (max 5 hops x
# 1us) with margin, and above tau_max (137us) so that FDL loopback never pushes
# a burst past its own BCP. Experiment C sweeps this down deliberately.
#
# maxOffset MUST be strictly greater than minOffset. OBS_BurstSender drops a
# burst when simTime+minOffset >= scheduled send time, and the free-channel
# path schedules the burst at simTime+maxOffset. Equal values therefore drop
# every burst at the edge (scalar "burst dropped by reaching Minimum Offset")
# before any BCP reaches a core node.
**.packetBurstifier[*].minOffset = 500us
**.packetBurstifier[*].maxOffset = 1ms

# ============ FDL ============
# Defaults are the No-FDL baseline; derived configs turn it on and sweep tau.
**.sat*.coreSwitch.useFDL = false
# Horizon + void filling scheduler option: the comparison arm of experiment A, not a
# third FDL strategy. Stated explicitly (instead of relying on the NED default) for the
# same reason useFDL is: a later NED default change must not silently move the baseline.
# With it off the admission rule is the append-only horizon, bit-for-bit as before.
**.sat*.coreSwitch.enableVoidFilling = false
**.sat*.coreSwitch.fdlDelayTime = 34.4us
**.sat*.coreSwitch.fdlOffsetMode = "DO"
# Single loopback is a project red line (AGENTS.md: "FDL 最大回环次数为 1").
# -1 means unlimited, and because the BCP carries fdlLoopCount across nodes a
# burst could then loop once at EVERY node on its path (up to 5 hops). Measured
# 2026-09-18 on ExpA-TauSweep: 147,935 multi-loop events under -1, none under 1.
# The paired probe (same seed, rho~0.59) showed the choice is not cosmetic:
#   tau=34.4us  (-1) 12.64%  ->  (1) 13.48%
#   tau=137.4us (-1) 23.30%  ->  (1) 19.61%   (No-FDL reference: 18.71%)
# The qualitative result survives (an over-long delay line is still worse than
# no delay line), but the margin narrows from 4.6pp to 0.9pp, so the sweep must
# be run under = 1.
**.sat*.coreSwitch.maxFdlLoopsPerBurst = 1

# ============ Edge scheduling ============
# 0=Dynamic, 1=NoPreemption, 2=RoundRobin, 3=Static.
**.sat*.edgeRouter.obs.assembler.dispatcher.dispatchMode = 0

# ============ Traffic: uniform all-to-all ============
# One UDPBasicApp per host with all nine peers listed in destAddresses. INET
# picks a destination uniformly at random per packet, which produces uniform
# all-to-all traffic from a single app and naturally exercises the 8 edge
# queues against 9 destination labels. app[1] is the sink for incoming traffic.
#
# Phase-1 sourced every flow at sat1, which made the topology a single-source
# star: intermediate nodes never saw traffic from several upstream neighbours,
# which is exactly the situation FDL exists to handle.
**.sat*.host.numPingApps = 0
**.sat*.host.numTcpApps = 0
**.sat*.host.numUdpApps = 2

**.sat*.host.udpApp[0].typename = "UDPBasicApp"
**.sat*.host.udpApp[0].destPort = 5000
**.sat*.host.udpApp[0].localPort = 5001
**.sat*.host.udpApp[0].messageLength = 1400B
**.sat*.host.udpApp[0].startTime = uniform(0s, 1ms)
# INET UDPBasicApp treats stopTime < 0 as "run forever" (NED default -1s).
# stopTime = 0s is a real deadline at t=0, and with a jittered startTime it
# trips "Invalid startTime/stopTime parameters" during initialize().
**.sat*.host.udpApp[0].stopTime = -1s
# Mean send interval is THE load knob.
#
# 2026-09-18 RECALIBRATION (results/FDL-Calibrate-recal-2026-09-18/, 14 run, all
# platform checks PASS). The fix to the edge sender's guardTime changed burst
# pacing, so the Week-5 numbers no longer apply:
#   measured rho:  42.6us -> 0.3472   30us -> 0.4595   21.3us -> 0.5920
#   interpolated rho=0.40 -> 35.58us, written back below as 35.6us.
# Week-5 (2026-09-09, guardTime=1ns, no warmup) had 35.9us -> rho~0.40; the
# difference is <1% in rho and well inside calibration noise. The Week-5 .sca
# files in results/FDL-Calibrate/ are retained as the historical record.
**.sat*.host.udpApp[0].sendInterval = exponential(35.6us)

**.sat*.host.udpApp[1].typename = "UDPSink"
**.sat*.host.udpApp[1].localPort = 5000

**.sat1.host.udpApp[0].destAddresses  = "sat2.host sat3.host sat4.host sat5.host sat6.host sat7.host sat8.host sat9.host sat10.host"
**.sat2.host.udpApp[0].destAddresses  = "sat1.host sat3.host sat4.host sat5.host sat6.host sat7.host sat8.host sat9.host sat10.host"
**.sat3.host.udpApp[0].destAddresses  = "sat1.host sat2.host sat4.host sat5.host sat6.host sat7.host sat8.host sat9.host sat10.host"
**.sat4.host.udpApp[0].destAddresses  = "sat1.host sat2.host sat3.host sat5.host sat6.host sat7.host sat8.host sat9.host sat10.host"
**.sat5.host.udpApp[0].destAddresses  = "sat1.host sat2.host sat3.host sat4.host sat6.host sat7.host sat8.host sat9.host sat10.host"
**.sat6.host.udpApp[0].destAddresses  = "sat1.host sat2.host sat3.host sat4.host sat5.host sat7.host sat8.host sat9.host sat10.host"
**.sat7.host.udpApp[0].destAddresses  = "sat1.host sat2.host sat3.host sat4.host sat5.host sat6.host sat8.host sat9.host sat10.host"
**.sat8.host.udpApp[0].destAddresses  = "sat1.host sat2.host sat3.host sat4.host sat5.host sat6.host sat7.host sat9.host sat10.host"
**.sat9.host.udpApp[0].destAddresses  = "sat1.host sat2.host sat3.host sat4.host sat5.host sat6.host sat7.host sat8.host sat10.host"
**.sat10.host.udpApp[0].destAddresses = "sat1.host sat2.host sat3.host sat4.host sat5.host sat6.host sat7.host sat8.host sat9.host"

# ============ Run control ============
# The 5 ms per-hop propagation makes the startup transient last ~25 ms on the
# longest path; 2 s keeps that below ~1% of the averaging window. The measured
# channelUtilization scalars divide by the full simTime(), so the transient is
# not excluded and the window has to be long enough to make it negligible.
sim-time-limit = 2s
**.vector-recording = false
**.scalar-recording = true
cmdenv-express-mode = true
